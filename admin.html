<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow"><title>Painel de acessos</title>
<style>
:root{--bg:#090b0e;--card:#12161a;--line:rgba(255,255,255,.08);--tx:#f1f3f5;--mut:#8e98a4;--o:#ff6a21;--g:#3ddc84;--y:#f5b942}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:760px;margin:0 auto;padding:18px 16px 60px}
h1{margin:0;font-size:22px;letter-spacing:-.01em}.sub{color:var(--mut);font-size:13px;margin-top:2px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}
button{font:inherit;cursor:pointer}.btn{border:0;border-radius:999px;padding:10px 16px;font-weight:700;color:#1a0d04;background:linear-gradient(135deg,#ff9a14,#ff5a1a)}
.ghost{background:rgba(255,255,255,.07);color:var(--tx)}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.kpi{background:var(--card);border-radius:16px;padding:14px 12px;box-shadow:inset 0 0 0 1px var(--line)}.kpi b{display:block;font-size:26px;letter-spacing:-.02em}.kpi span{color:var(--mut);font-size:12px}
.kpi.hi{background:linear-gradient(180deg,#1d140e,#14100c);box-shadow:inset 0 0 0 1px rgba(255,106,33,.4)}.kpi.hi b{color:#ff8a3a}
.sec{margin:22px 0 10px;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--mut);font-weight:700}
.chart{background:var(--card);border-radius:16px;padding:14px;box-shadow:inset 0 0 0 1px var(--line)}
.bars{display:flex;align-items:flex-end;gap:6px;height:110px}.bar{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:3px;height:100%}
.bar i{display:block;width:100%;border-radius:5px 5px 2px 2px;background:var(--o);min-height:2px}.bar em{display:block;width:100%;border-radius:3px;background:#2d6cdf;min-height:0}
.bar small{font-size:10px;color:var(--mut)}.leg{display:flex;gap:14px;margin-top:10px;font-size:12px;color:var(--mut)}.leg b{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:5px}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
input[type=search],input[type=email],input[type=password]{width:100%;border:0;outline:0;border-radius:14px;background:var(--card);color:var(--tx);font:inherit;padding:12px 14px;box-shadow:inset 0 0 0 1px var(--line)}
.chip{border:0;border-radius:999px;padding:7px 13px;font-size:13px;font-weight:600;background:var(--card);color:var(--mut);box-shadow:inset 0 0 0 1px var(--line)}.chip.on{background:rgba(255,106,33,.16);color:#ff8a3a;box-shadow:inset 0 0 0 1px rgba(255,106,33,.5)}
.u{background:var(--card);border-radius:16px;padding:12px 14px;margin-bottom:8px;box-shadow:inset 0 0 0 1px var(--line)}
.u .h{display:flex;align-items:center;gap:10px}.dot{flex:none;width:10px;height:10px;border-radius:50%;background:#4a535c}.dot.g{background:var(--g)}.dot.y{background:var(--y)}
.u .n{min-width:0;flex:1}.u .n b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.u .n span{display:block;color:var(--mut);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.u .w{color:var(--mut);font-size:12px;text-align:right;white-space:nowrap}
.u .s{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:10px}.u .s div{background:rgba(255,255,255,.04);border-radius:10px;padding:7px 4px;text-align:center}.u .s b{display:block;font-size:16px}.u .s span{font-size:10.5px;color:var(--mut)}
.tag{display:inline-block;border-radius:999px;padding:1px 8px;font-size:11px;margin-left:6px;background:rgba(61,142,255,.16);color:#7db4ff}
.login{max-width:380px;margin:12vh auto 0}.login form{display:grid;gap:10px;margin-top:18px}.err{color:#ff7a6a;font-size:13px;min-height:18px}
.note{background:var(--card);border-radius:16px;padding:16px;color:var(--mut);line-height:1.55;box-shadow:inset 0 0 0 1px var(--line)}.note code{background:#0c0f12;padding:2px 6px;border-radius:6px;color:#ffb27a}
.hide{display:none!important}
</style></head><body>
<div class="wrap" id="app"><div class="note">Carregando…</div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
var URL_='https://nzkjpeggckvjhfsyluar.supabase.co',KEY='sb_publishable_lpEVZFxgVnTe4-ME8pWkhA__4Uza1RS';
var $=function(i){return document.getElementById(i)},app=$("app"),cl=null,DATA=null,FILT="all",Q="";
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function ago(t){if(!t)return"nunca";var s=(Date.now()-new Date(t).getTime())/1000;if(s<90)return"agora";if(s<3600)return"há "+Math.round(s/60)+" min";if(s<86400)return"há "+Math.round(s/3600)+" h";var d=Math.round(s/86400);return d===1?"ontem":"há "+d+" dias"}
function dt(t){if(!t)return"—";var d=new Date(t);return d.toLocaleDateString("pt-BR")}
function boot(){
 if(!window.supabase){app.innerHTML='<div class="note">Não foi possível carregar o Supabase. Confira a conexão.</div>';return}
 cl=window.supabase.createClient(URL_,KEY,{auth:{persistSession:true,autoRefreshToken:true}});
 cl.auth.getSession().then(function(r){if(r.data&&r.data.session)load();else loginView()})}
function loginView(msg){app.innerHTML='<div class="login"><h1>Painel de acessos</h1><div class="sub">Entre com a conta de administrador (a mesma do app).</div><form id="lf"><input type="email" id="em" placeholder="E-mail" autocomplete="username" required><input type="password" id="pw" placeholder="Senha" autocomplete="current-password" required><button class="btn" type="submit">Entrar</button><div class="err" id="er">'+esc(msg||"")+'</div></form></div>';
 $("lf").onsubmit=function(e){e.preventDefault();$("er").textContent="Entrando…";cl.auth.signInWithPassword({email:$("em").value.trim(),password:$("pw").value}).then(function(r){if(r.error){$("er").textContent="E-mail ou senha incorretos.";return}load()})}}
function load(){app.innerHTML='<div class="note">Carregando números…</div>';
 cl.rpc("ev_admin_overview").then(function(r){
  if(r.error){var m=String(r.error.message||"");if(/EV_FORBIDDEN/.test(m))app.innerHTML='<div class="note"><b>Sem permissão.</b><br>Esta conta não está na lista de administradores. Rode o arquivo <code>28_painel_acessos.sql</code> no Supabase (com o e-mail certo) e atualize esta página.<br><br><button class="btn ghost" id="lo">Sair</button></div>';
   else if(/ev_admin_overview|function/.test(m))app.innerHTML='<div class="note"><b>O painel ainda não foi instalado.</b><br>Rode o arquivo <code>28_painel_acessos.sql</code> no SQL Editor do Supabase e atualize esta página.<br><br><button class="btn ghost" id="lo">Sair</button></div>';
   else app.innerHTML='<div class="note">Erro: '+esc(m)+'<br><br><button class="btn" id="rf">Tentar de novo</button></div>';
   if($("lo"))$("lo").onclick=out;if($("rf"))$("rf").onclick=load;return}
  DATA=r.data;view()})}
function out(){cl.auth.signOut().then(loginView)}
function status(u){if(!u.last_activity)return"";var d=(Date.now()-new Date(u.last_activity).getTime())/864e5;return d<=1?"g":d<=7?"y":""}
function view(){var t=DATA.totals,pct=t.accounts?Math.round(t.active_7d/t.accounts*100):0;
 var h='<div class="top"><div><h1>Painel de acessos</h1><div class="sub">Atualizado '+ago(DATA.now)+'</div></div><div style="display:flex;gap:8px"><button class="btn" id="rf">Atualizar</button><button class="btn ghost" id="lo">Sair</button></div></div>';
 h+='<div class="kpis"><div class="kpi hi"><b>'+t.accounts+'</b><span>Contas criadas</span></div><div class="kpi hi"><b>'+t.active_7d+'</b><span>Ativas em 7 dias ('+pct+'%)</span></div><div class="kpi"><b>'+t.active_1d+'</b><span>Ativas hoje</span></div>'+
  '<div class="kpi"><b>'+t.active_30d+'</b><span>Ativas em 30 dias</span></div><div class="kpi"><b>'+t.new_7d+'</b><span>Novas em 7 dias</span></div><div class="kpi"><b>'+t.with_workout+'</b><span>Já registraram treino</span></div>'+
  '<div class="kpi"><b>'+t.with_ficha+'</b><span>Com ficha</span></div><div class="kpi"><b>'+t.in_community+'</b><span>Em comunidade</span></div><div class="kpi"><b>'+t.professionals+'</b><span>Profissionais</span></div></div>';
 var mx=Math.max(1,Math.max.apply(null,DATA.daily.map(function(d){return Math.max(d.active,d.new)})));
 h+='<div class="sec">Últimos 14 dias</div><div class="chart"><div class="bars">'+DATA.daily.map(function(d){return'<div class="bar" title="'+d.day+': '+d.active+' ativas, '+d.new+' novas"><em style="height:'+Math.round(d.new/mx*100)+'%"></em><i style="height:'+Math.round(d.active/mx*100)+'%"></i><small>'+d.day.slice(8)+'</small></div>'}).join("")+'</div><div class="leg"><span><b style="background:#ff6a21"></b>Ativas no dia</span><span><b style="background:#2d6cdf"></b>Contas novas</span></div></div>';
 h+='<div class="sec">Pessoas ('+DATA.users.length+')</div><div class="tools"><input type="search" id="q" placeholder="Buscar nome ou e-mail"></div><div class="tools" id="ch">'+[["all","Todos"],["a7","Ativos 7 dias"],["in","Inativos"],["nw","Nunca treinaram"]].map(function(c){return'<button class="chip'+(FILT===c[0]?" on":"")+'" data-f="'+c[0]+'">'+c[1]+'</button>'}).join("")+'<button class="chip" id="csv">Baixar CSV</button></div><div id="list"></div>';
 app.innerHTML='<div class="wrap" style="padding:0">'+h+'</div>';
 $("rf").onclick=load;$("lo").onclick=out;$("q").value=Q;$("q").oninput=function(){Q=this.value;list()};
 $("ch").onclick=function(e){var b=e.target.closest("[data-f]");if(b){FILT=b.dataset.f;[].forEach.call(document.querySelectorAll("#ch .chip[data-f]"),function(x){x.classList.toggle("on",x.dataset.f===FILT)});list()}if(e.target.id==="csv")csv()};
 list()}
function list(){var q=Q.trim().toLowerCase(),now=Date.now();
 var us=DATA.users.filter(function(u){if(q&&(String(u.email||"")+" "+String(u.name||"")).toLowerCase().indexOf(q)<0)return false;
  var d=u.last_activity?(now-new Date(u.last_activity).getTime())/864e5:9999;
  return FILT==="a7"?d<=7:FILT==="in"?d>7:FILT==="nw"?u.workouts===0:true});
 $("list").innerHTML=us.length?us.map(function(u){return'<div class="u"><div class="h"><i class="dot '+status(u)+'"></i><div class="n"><b>'+esc(u.name||u.email||"Sem nome")+(u.role==="profissional"?'<span class="tag" style="display:inline">Profissional</span>':'')+'</b><span>'+esc(u.name?u.email:"")+(u.apps&&u.apps.length?(u.name?" · ":"")+u.apps.map(function(a){return a==="pro"?"app Pro":"app Praticantes"}).join(", "):"")+'</span></div><div class="w">Último uso<br><b style="color:var(--tx)">'+ago(u.last_activity)+'</b></div></div>'+
  '<div class="s"><div><b>'+u.workouts+'</b><span>treinos</span></div><div><b>'+u.fichas+'</b><span>fichas</span></div><div><b>'+u.checkins+'</b><span>check-ins</span></div><div><b>'+u.comms+'</b><span>comunid.</span></div></div>'+
  '<div class="sub" style="margin-top:8px">Conta criada em '+dt(u.created)+(u.opens?" · "+u.opens+" aberturas do app":"")+(u.last_workout?" · último treino "+ago(u.last_workout):"")+'</div></div>'}).join(""):'<div class="note">Ninguém encontrado.</div>'}
function csv(){var rows=[["nome","email","perfil","criada_em","ultimo_uso","treinos","fichas","checkins","comunidades","aberturas"]].concat(DATA.users.map(function(u){return[u.name||"",u.email||"",u.role||"",u.created||"",u.last_activity||"",u.workouts,u.fichas,u.checkins,u.comms,u.opens]}));
 var s=rows.map(function(r){return r.map(function(c){return'"'+String(c).replace(/"/g,'""')+'"'}).join(",")}).join("\n"),a=document.createElement("a");a.href=URL.createObjectURL(new Blob(["﻿"+s],{type:"text/csv"}));a.download="acessos.csv";a.click()}
boot();
</script></body></html>
