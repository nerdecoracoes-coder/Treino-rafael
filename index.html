<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#1b2127">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<title>Evolute Training</title>

<style>
:root{
 --bg:#0b0f13;
 --surface:#101214;
 --surface2:#17191c;
 --line:#2a2d32;
 --text:#f8fafc;
 --muted:#94a3b8;
 --accent:#f97316;
 --accent2:#ff8a1f;
 --accent-soft:#ffb45c;
 --danger:#ef4444;
 --success:#22c55e;
}

*{box-sizing:border-box}

body{
 margin:0;
 font-family:Arial,sans-serif;
 background:
  radial-gradient(900px 500px at 50% -10%, rgba(255,154,31,.10), transparent 58%),
  linear-gradient(145deg,#0b0f13 0%,#171c22 46%,#0d1116 100%);
 background-attachment:fixed;
 color:var(--text)
}

button,input,select{font:inherit}

button{cursor:pointer}

header{
 background:linear-gradient(145deg,#0b0f13 0%,#171c22 58%,#11161b 100%);
 color:#fff;
 padding:10px 12px 27px;
 position:sticky;
 top:0;
 z-index:20;
 border-bottom:1px solid var(--line);
 min-height:72px;
 box-sizing:border-box
}

header h1{
 margin:0;
 font-size:21px;
 text-align:center;
 line-height:44px
}

.profile{
 position:absolute;
 top:10px;
 left:12px;
 width:44px;
 height:44px;
 margin:0;
 padding:0
}

.profile-selector{
 display:flex;
 align-items:center;
 justify-content:flex-start;
 position:relative;
 top:0;
 left:0;
 width:44px;
 height:44px;
 margin:0
}

.profile-avatar{
 width:44px;
 height:44px;
 min-width:44px;
 border-radius:50%;
 background:var(--accent);
 color:#fff;
 display:flex;
 align-items:center;
 justify-content:center;
 font-size:22px;
 font-weight:bold;
 overflow:hidden;
 border:2px solid #fff;
 cursor:pointer;
 position:relative;
 z-index:2
}

.profile-selector::after{
 content:"Perfil";
 position:absolute;
 top:48px;
 left:0;
 width:44px;
 text-align:center;
 color:#cbd5e1;
 font-size:12px;
 font-weight:500;
 line-height:1.1;
 pointer-events:none
}

.profile-selector select{
 position:absolute;
 top:0;
 left:0;
 width:44px;
 height:44px;
 margin:0;
 padding:0;
 opacity:0;
 cursor:pointer;
 z-index:3;
 border:0;
 background:transparent
}

.profile-avatar img{
 width:100%;
 height:100%;
 object-fit:cover
}

select,input{
 width:100%;
 padding:11px;
 border:1px solid var(--line);
 border-radius:9px;
 font-size:14px;
 background:var(--surface2);
 color:var(--text)
}

input::placeholder{color:#707780}

.exerciseSelect{
 font-size:14px;
 font-weight:bold;
 padding:10px 8px
}

nav{
 display:grid;
 grid-template-columns:repeat(4,minmax(0,1fr)) minmax(0,1.12fr);
 align-items:stretch;
 gap:0;
 padding:0 4px 0 16px;
 background:linear-gradient(90deg,#0d1217 0%,#171c22 52%,#0e1318 100%);
 border-bottom:1px solid var(--line);
 position:sticky;
 top:92px;
 z-index:19
}

nav button{
 width:100%;
 min-width:0;
 padding:8px 1px 10px;
 border:0;
 background:transparent;
 font-weight:bold;
 color:var(--muted);
 font-size:clamp(11px,3.05vw,14px);
 line-height:1.15;
 white-space:nowrap;
 overflow:visible;
 text-overflow:clip;
 text-align:center;
 display:flex !important;
 flex-direction:column !important;
 align-items:center;
 justify-content:center;
 gap:4px;
}

.nav-icon{
 font-size:17px;
 line-height:1;
 flex:0 0 auto;
 color:#aebbd0;
 display:flex !important;
 align-items:center;
 justify-content:center;
 width:24px;
 height:24px;
 margin:0 auto;
}

.nav-svg{
 width:24px;
 height:24px;
 display:inline-flex;
 align-items:center;
 justify-content:center;
}

.nav-svg svg{
 width:22px;
 height:22px;
 display:block;
 fill:none;
 stroke:currentColor;
 stroke-width:2.2;
 stroke-linecap:round;
 stroke-linejoin:round;
}

nav button > span:last-child{
 display:block !important;
 line-height:1.1;
 text-align:center;
}

nav button.active .nav-icon{color:#fff;}

/* As cinco abas ocupam exatamente o mesmo espaço. As margens laterais são iguais,
   deixando o conjunto visualmente centralizado e a última aba sem corte. */
nav #btnHome,
nav #btnT,
nav #btnH,
nav #btnE,
nav #btnC{width:100%;}

nav button.active{
 color:#fff;
 border-bottom:3px solid var(--accent2)
}

main{
 max-width:700px;
 margin:auto;
 padding:12px 12px 90px
}

.card{
 background:var(--surface);
 border:1px solid var(--line);
 border-radius:14px;
 padding:15px;
 margin-bottom:12px;
 box-shadow:0 4px 16px #0005
}


.back-to-routines{
 display:inline-flex;
 align-items:center;
 gap:5px;
 padding:4px 0;
 margin:0 0 10px 2px;
 border:0 !important;
 outline:0 !important;
 background:transparent !important;
 color:#ff9a1f;
 font-size:14px;
 font-weight:700;
 text-transform:lowercase;
 cursor:pointer;
 box-shadow:none !important;
 -webkit-appearance:none;
 appearance:none
}
.back-to-routines:hover{color:#ffb45c}
.back-to-routines:active{transform:translateX(-2px);color:#ffd0a3}

/* Lista inicial de treinos: cards grandes, um abaixo do outro */
.routines-page-title{
 margin:4px 0 6px;
 font-size:28px
}
.routines-page-subtitle{
 margin:0 0 16px;
 color:var(--muted);
 font-size:14px
}
.routines-list{
 display:flex;
 flex-direction:column;
 gap:12px
}
.routine-list-card{
 width:100%;
 min-height:92px;
 padding:20px 92px 20px 20px;
 border:1px solid #263449 !important;
 border-radius:18px;
 background:#121416 !important;
 color:#f8fafc !important;
 display:flex;
 align-items:center;
 justify-content:space-between;
 text-align:left;
 box-shadow:none;
 cursor:pointer;
 appearance:none;
 -webkit-appearance:none;
 position:relative;
 transition:background .18s ease, border-color .18s ease, transform .18s ease, box-shadow .18s ease
}
.routine-list-card:active{
 transform:scale(.99);
 background:#151719 !important
}
.routine-list-card:hover{
 background:#1b1d20 !important;
 border-color:#ff8a1f !important;
 box-shadow:0 4px 14px rgba(249,115,22,.10)
}

/* Menu de Configurações */
.settings-menu{display:flex;flex-direction:column;gap:12px;margin-top:18px}
.settings-menu-card{position:relative;width:100%;min-height:92px;padding:20px 54px 20px 20px;border:1px solid #263449;border-radius:18px;background:#121416;color:#f8fafc;text-align:left;cursor:pointer;transition:.18s ease;box-sizing:border-box}
.settings-menu-card:hover{border-color:#ff8a1f;background:#1b1d20;transform:translateY(-1px)}
.settings-menu-card:active{transform:scale(.99)}
.settings-menu-card strong{display:block;font-size:20px;line-height:1.2}
.settings-menu-card span{display:block;margin-top:7px;color:#94a3b8;font-size:14px;line-height:1.4}
.settings-menu-card b{position:absolute;right:20px;top:50%;transform:translateY(-50%);font-size:30px;font-weight:400;color:#ff9a1f}
.settings-menu-backup{border-color:#34383e}
.settings-section-head>h1{margin-top:20px}
/* Fichas na configuração: primeiro apenas resumo; detalhes somente após seleção */
.config-routine-list{display:flex;flex-direction:column;gap:10px;margin-top:14px;margin-bottom:14px}
.config-routine-summary{
 width:100%;
 min-height:72px;
 padding:14px 16px;
 border:1px solid #2a2d32;
 border-radius:14px;
 background:#121416;
 color:#f8fafc;
 display:flex;
 align-items:center;
 justify-content:space-between;
 gap:12px;
 text-align:left;
 cursor:pointer;
 appearance:none;
 -webkit-appearance:none;
 transition:background .18s ease,border-color .18s ease,transform .18s ease,box-shadow .18s ease
}
.config-routine-summary:hover{border-color:#ff8a1f;background:#1b1d20}
.config-routine-summary:active{transform:scale(.99)}
.config-routine-summary.selected{border-color:#ff9a1f;background:#38200f;box-shadow:0 0 0 1px rgba(255,154,31,.28) inset}
.config-routine-summary span:first-child{display:flex;flex-direction:column;gap:5px;min-width:0}
.config-routine-summary strong{font-size:19px}
.config-routine-summary small{font-size:13px;color:#94a3b8;line-height:1.35}
.config-routine-summary.selected small{color:#ffd0a3}

/* Tela exclusiva da ficha selecionada */
.routine-detail-page{
 width:100%;
 max-width:700px;
 margin:0 auto;
}
.routine-detail-page .routine-details-header{
 margin:4px 0 18px;
 padding-bottom:14px;
 border-bottom:1px solid var(--line);
}
.routine-detail-page .routine-details-header h2{margin:0 0 5px;font-size:30px}
.routine-detail-page .routine-details-info{color:var(--muted);font-size:15px;line-height:1.45}
.routine-detail-page .routine-details-actions{display:flex;gap:10px;margin:0 0 18px}
.routine-detail-page .routine-details-actions button{flex:1}
.routine-detail-page .routine-exercises-title{font-size:20px;margin:18px 0 10px}
.config-routine-summary-arrow{font-size:28px;color:#ff9a1f;line-height:1}
.config-routine-empty{padding:18px 4px;color:var(--muted);font-size:14px;text-align:center}
.selected-routine-panel{margin-top:16px;padding:16px;border:1px solid #34383e;border-radius:16px;background:#0d0f11}
.selected-routine-header{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.selected-routine-header h3{margin:0 0 5px;font-size:24px}
.selected-routine-info{color:#ffb45c;font-size:14px;line-height:1.4}
.selected-routine-actions{margin-top:14px}
.routine-edit-banner{margin:12px 0;padding:11px 12px;border:1px solid #ff8a1f;border-radius:10px;background:#24170f;color:#ffd0a3;font-size:13px}
.config-exercise-item{margin-top:12px}
.config-exercise-item:not(.editing){background:#121416}
.config-exercise-item:not(.editing) input:disabled{opacity:1;color:#cbd5e1;-webkit-text-fill-color:#cbd5e1}
@media(max-width:480px){.selected-routine-header{flex-direction:column}.selected-routine-header .secondary{width:100%}}

.routine-list-card-content{
 display:flex;
 flex-direction:column;
 align-items:flex-start;
 gap:5px;
 min-width:0;
 flex:1
}
.routine-list-card-name{
 font-size:20px;
 font-weight:800;
 line-height:1.2
}
.routine-list-card-description{
 font-size:14px;
 line-height:1.4;
 color:#94a3b8;
 font-weight:500
}
.routine-list-card-arrow{
 position:absolute;
 right:20px;
 top:50%;
 transform:translateY(-50%);
 font-size:34px;
 line-height:1;
 color:#ff9a1f;
 font-weight:300
}

.routine-recommended{
 position:absolute;
 right:54px;
 top:50%;
 transform:translateY(-50%);
 display:inline-flex;
 align-items:center;
 padding:5px 9px;
 border-radius:999px;
 background:#24170f;
 border:1px solid #ff8a1f;
 color:#ffb45c;
 font-size:11px;
 font-weight:700;
 white-space:nowrap;
 margin-left:0;
 }

.home-recommended-card{
 width:100%;
 min-width:100%;
 max-width:none;
 align-self:stretch;
 display:flex;
 flex-direction:column;
 box-sizing:border-box;
 margin:0 0 14px 0;
 padding:42px 18px 18px 18px;
 text-align:left;
 position:relative;
 border:2px solid #ff8a1f;
 border-radius:18px;
 background:#d95f02;
 color:#fff;
 box-shadow:0 7px 22px rgba(249,115,22,.28), inset 0 1px 0 rgba(255,255,255,.12);
 cursor:pointer;
 transition:transform .18s ease, background .18s ease, box-shadow .18s ease
}
.home-recommended-card:active{
 transform:scale(.985);
 background:#b84d00
}
.home-recommended-label{
 display:flex !important;
 position:static !important;
 width:max-content;
 margin-left:auto !important;
 margin-right:0 !important;
 margin-bottom:10px;
 padding:4px 8px;
 border-radius:999px;
 background:#facc15;
 color:#111827;
 font-size:11px;
 font-weight:900;
 line-height:1.2;
 align-items:center;
 justify-content:center;
}
.home-recommended-name{
 display:flex;
 align-items:center;
 justify-content:space-between;
 gap:12px;
 font-size:24px;
 font-weight:900
}
.home-recommended-arrow{
 font-size:32px;
 font-weight:300;
 color:#ffd0a3
}

.exercise h3{
 margin:0;
 font-size:20px;
 line-height:1.2
}

.exercise-main-row{
 display:flex;
 align-items:center;
 gap:7px;
 margin-bottom:10px;
 position:relative;
 padding-right:30px;
 min-height:54px
}

.exercise-main-row h3{
 min-width:0;
 flex:0 1 auto;
 max-width:calc(100% - 82px);
 line-height:1.12;
 word-break:normal;
 overflow-wrap:anywhere
}

.exercise-name-line{
 display:block
}

.exercise-main-row .exercise-animation-card{
 flex:0 0 74px;
 margin:0;
 width:74px;
 height:54px
}

.exercise-animation-placeholder{
 flex:0 0 74px;
 width:74px;
 height:54px;
 visibility:hidden
}

.exercise-complete{
 position:absolute;
 top:0;
 right:0;
 width:24px;
 height:24px;
 display:flex;
 align-items:center;
 justify-content:center;
 margin:0;
 color:var(--muted);
 cursor:pointer;
 user-select:none
}

.exercise-complete span{
 display:none
}

.exercise-complete input{
 width:21px;
 height:21px;
 margin:0;
 accent-color:#22c55e;
 cursor:pointer
}

.exercise-complete.done{
 color:#22c55e;
 font-weight:bold
}


.completed-exercise{
 opacity:1 !important;
 background:#171717 !important;
 border:0 !important;
 box-shadow:none !important;
 border-radius:0 !important;
 color:#777 !important;
}
.completed-exercise h3,
.completed-exercise .last,
.completed-exercise .small,
.completed-exercise label{
 color:#777 !important;
}
.completed-exercise .exercise-animation-card{
 filter:grayscale(1) brightness(.58);
 opacity:1 !important;
}
.completed-exercise input:disabled{
 background:#151515 !important;
 color:#666 !important;
}
.completed-slide-target{
 will-change:transform;
 z-index:50;
 background:#171717 !important;
 border:0 !important;
 box-shadow:none !important;
 border-radius:0 !important;
 opacity:1 !important;
}
.completed-section-card{
 background:#6f2f00 !important;
 border:2px solid #f97316 !important;
 box-shadow:0 6px 20px #0008 !important;
}
.completed-section-card h2,
.completed-section-card .muted{
 color:#fff0df !important;
}
.completed-section-card .badge{
 background:#d95f02 !important;
 color:#fff !important;
}
.completed-lock{color:#86efac;font-size:12px;margin:6px 0 10px}
.rep-low{border-color:#ef4444!important;box-shadow:0 0 0 1px #ef4444 inset}
.rep-ok{border-color:#22c55e!important;box-shadow:0 0 0 1px #22c55e inset}
.rep-max{border-color:#eab308!important;box-shadow:0 0 0 1px #eab308 inset}

.muted,.small{
 color:var(--muted);
 font-size:13px
}

.last{
 color:#ff9a1f;
 font-size:13px;
 margin-bottom:10px
}

.target{
 background:#24170f;
 border:1px solid #d95f02;
 border-radius:10px;
 padding:10px;
 margin:8px 0 12px
}

.target strong{color:#ff9a1f}

.grid{
 display:grid;
 grid-template-columns:1fr 1fr;
 gap:8px
}

label{
 display:block;
 font-size:12px;
 color:var(--muted);
 margin-bottom:4px
}

.primary{
 width:100%;
 padding:14px;
 border:0;
 border-radius:10px;
 background:var(--accent);
 color:#fff;
 font-size:17px;
 font-weight:bold
}

.primary:hover{background:var(--accent2)}

.secondary{
 padding:10px;
 border:1px solid var(--line);
 border-radius:8px;
 background:var(--surface2);
 color:var(--text);
 font-weight:bold
}

.danger{
 padding:10px;
 border:0;
 border-radius:8px;
 background:#3a1216;
 color:#fca5a5;
 font-weight:bold
}

.success{text-align:center}

.history-item{
 border-top:1px solid var(--line);
 padding:12px 0
}

.row{
 display:flex;
 gap:8px;
 align-items:center
}

.row>*{flex:1}

.editor{
 border:1px solid var(--line);
 border-radius:10px;
 padding:12px;
 margin:8px 0
}

.move{
 display:flex;
 gap:5px;
 margin-top:8px
}

.move button{flex:1}

hr{
 border:0;
 border-top:1px solid var(--line);
 margin:15px 0
}

.badge{
 display:inline-block;
 padding:5px 8px;
 border-radius:999px;
 background:#1b1d20;
 color:#ffb45c;
 font-size:12px
}

 .developer-notifications{
 border:1px solid #7c3aed;
 background:rgba(124,58,237,.10);
 border-radius:12px;
 padding:14px;
 margin-bottom:14px
}

.developer-notification{
 display:flex;
 align-items:center;
 justify-content:space-between;
 gap:12px;
 padding:10px 0;
 border-bottom:1px solid var(--line)
}

.developer-notification:last-child{
 border-bottom:0;
 padding-bottom:0
}

.developer-notification:first-child{
 padding-top:0
}

.developer-notification-title{
 font-weight:bold
}

.developer-notification-meta{
 margin-top:4px;
 color:var(--muted);
 font-size:12px
}

.library-media-status{
 margin-top:8px;
 color:var(--muted)
}

.media-grid{
 display:grid;
 grid-template-columns:repeat(2,1fr);
 gap:8px;
 margin-top:10px
}

.media-grid img{
 width:100%;
 aspect-ratio:1/1;
 object-fit:cover;
 border-radius:9px;
 border:1px solid var(--line);
 background:#080b10
}

.exercise-animation-card{
 position:relative;
 display:block;
 width:100px;
 height:72px;
 margin:6px auto 0;
 border:1px solid var(--line);
 border-radius:10px;
 overflow:hidden;
 background:#080b10;
 cursor:pointer;
 padding:0;
}

.exercise-animation{
 display:block;
 width:100%;
 height:100%;
 object-fit:cover;
 background:#080b10
}

.exercise-animation-card::after{
 content:"▶";
 position:absolute;
 left:50%;
 top:50%;
 transform:translate(-50%,-50%);
 width:30px;
 height:30px;
 border-radius:50%;
 display:flex;
 align-items:center;
 justify-content:center;
 background:rgba(0,0,0,.62);
 color:#fff;
 font-size:15px;
 pointer-events:none;
}

/* Formulário de nova ficha de treino */
.routine-form{
 margin-top:14px;
 padding:18px;
 border:1px solid var(--line);
 border-radius:16px;
 background:#0d0f11;
}
.routine-form h3{margin:0 0 6px;font-size:22px}
.routine-form-subtitle{margin:0 0 16px;color:var(--muted);font-size:14px}
.routine-form-field{margin-bottom:16px}
.routine-form-field label{display:block;margin-bottom:7px;font-weight:700;color:#e2e8f0}
.routine-basic-info-button{
 width:100%;
 min-height:54px;
 padding:12px 14px;
 border:1px solid #34383e;
 border-radius:11px;
 background:#17191c;
 color:#f8fafc;
 display:flex;
 align-items:center;
 justify-content:space-between;
 text-align:left;
}
.routine-basic-info-button .summary{color:#94a3b8;font-size:13px;line-height:1.35}
.routine-form-actions{display:flex;gap:10px;margin-top:6px}
.routine-form-actions button{flex:1}
.routine-info-modal{
 position:fixed;
 inset:0;
 z-index:10000;
 display:none;
 align-items:flex-end;
 justify-content:center;
 background:rgba(0,0,0,.72);
 padding:12px;
}
.routine-info-modal.open{display:flex}
.routine-info-sheet{
 width:min(700px,100%);
 max-height:88vh;
 overflow:auto;
 background:#101214;
 border:1px solid #34383e;
 border-radius:20px 20px 14px 14px;
 padding:18px;
 box-shadow:0 -12px 40px rgba(0,0,0,.45);
}
.routine-info-sheet-header{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:6px}
.routine-info-sheet-header h3{margin:0;font-size:22px}
.routine-info-close{border:0;background:transparent;color:#94a3b8;font-size:28px;padding:2px 8px}
.routine-info-help{margin:0 0 16px;color:var(--muted);font-size:14px}
.routine-info-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.routine-info-option{
 position:relative;
 display:flex;
 align-items:center;
 min-height:48px;
 padding:11px 12px;
 border:1px solid #2a2d32;
 border-radius:11px;
 background:#17191c;
 color:#e5e7eb;
 cursor:pointer;
}
.routine-info-option.complete{
 border-color:#ff8a1f;
 background:#24170f;
 color:#ffd0a3;
 font-weight:800;
}
.routine-info-option input{
 width:20px;
 height:20px;
 margin:0 10px 0 0;
 accent-color:#ff8a1f;
}
.routine-info-option:has(input:checked){
 border-color:#ff9a1f;
 background:#d95f02;
 color:#fff;
 box-shadow:0 0 0 1px rgba(255,154,31,.35) inset;
}
.routine-custom-info{
 margin-top:14px;
 padding-top:14px;
 border-top:1px solid #2a2d32;
}

const DBKEY="treinoRafaelDB_v7";

/* =========================================================
   ARMAZENAMENTO SEGURO
   ========================================================= */

function storageGet(key){

 try{
  return localStorage.getItem(key);
 }catch(e){
  return null;
 }

}

function storageSet(key,value){

 try{
  localStorage.setItem(key,value);
  return true;
 }catch(e){
  return false;
 }

}

/* =========================================================
   CATEGORIAS
   ========================================================= */

/* =========================================================
   FUNÇÕES BÁSICAS
   ========================================================= */

function uid(){

 return Date.now().toString(36)+
 Math.random().toString(36).slice(2,8);

}

function clone(o){

 return JSON.parse(JSON.stringify(o));

}

function esc(v){

 return String(v??"")
  .replace(/&/g,"&amp;")
  .replace(/</g,"&lt;")
  .replace(/>/g,"&gt;")
  .replace(/"/g,"&quot;")
  .replace(/'/g,"&#039;");

}

function formatExerciseName(name,index){

 const words=String(name||"").trim().split(/\s+/).filter(Boolean);

 if(words.length<=1)
  return `<span class="exercise-name-line">${index+1}. ${esc(name)}</span>`;

 const cut=Math.ceil(words.length/2);
 const first=words.slice(0,cut).join(" ");
 const second=words.slice(cut).join(" ");

 return `<span class="exercise-name-line">${index+1}. ${esc(first)}</span>`+
         `<span class="exercise-name-line">${esc(second)}</span>`;

}

function slug(v){

 return String(v||"perfil")
  .normalize("NFD")
  .replace(/[\u0300-\u036f]/g,"")
  .replace(/[^a-zA-Z0-9]+/g,"-")
  .replace(/^-|-$/g,"")
  .toLowerCase();

}

function today(){

 return new Date().toISOString().slice(0,10);

}

function formatDate(v){

 if(!v)return "-";

 const p=String(v).split("-");

 return p.length===3
  ?p[2]+"/"+p[1]+"/"+p[0]
  :v;

}

   ========================================================= */

function normalizeExercise(e){

 e=e||{};

 const series=Math.max(1,Number(e.series||3));

function readDB(){

 let data=null;

 try{

  const raw=storageGet(DBKEY);

  if(raw)
   data=JSON.parse(raw);

 }catch(e){

  data=null;

 }

 if(!data||typeof data!=="object")
  data=createInitialDB();

 if(!Array.isArray(data.profiles))
  data.profiles=[];

 data.profiles=data.profiles.filter(
  p=>p&&typeof p==="object"
 );

 if(!Array.isArray(data.history))
  data.history=[];

 if(!Array.isArray(data.evolution))
  data.evolution=[];

 if(!data.activeWorkouts||typeof data.activeWorkouts!=="object")
  data.activeWorkouts={};

 if(!Array.isArray(data.exerciseCategories))
  data.exerciseCategories=clone(DEFAULT_CATEGORIES);

 data.exerciseCategories=[

  ...new Map(

   data.exerciseCategories

    .map(x=>String(x||"").trim())

    .filter(x=>x)

    .map(x=>[
     x.toLowerCase(),
     x
    ])

  ).values()

 ];

 if(!Array.isArray(data.exerciseLibrary))
  data.exerciseLibrary=[];

 data.exerciseLibrary=data.exerciseLibrary
  .filter(Boolean)
  .map(x=>({

   id:x.id||uid(),
   name:x.name||"",
   category:x.category||"",
   image:x.image||"",
   images:Array.isArray(x.images)
    ?x.images
    :[],
   video:x.video||""

  }));

 /* EXERCÍCIOS DAS FICHAS PADRÃO
  * Mantém a biblioteca centralizada e acrescenta apenas
  * os exercícios que ainda não estiverem cadastrados.
  */
 const standardLibraryExercises={
  "Puxada aberta na polia":"Costas",
  "Remada neutra na máquina":"Costas",
  "Remada baixa triângulo":"Costas",
  "Crucifixo inverso na polia":"Ombros",
  "Bíceps na máquina":"Bíceps",
  "Rosca martelo com halteres":"Bíceps",
  "Encolhimento com halteres":"Ombros",
  "Crucifixo na máquina":"Peito",
  "Supino inclinado com halteres":"Peito",
  "Supino reto na máquina":"Peito",
  "Desenvolvimento máquina":"Ombros",
  "Elevação lateral com halteres":"Ombros",
  "Tríceps unilateral na polia":"Tríceps",
  "Tríceps francês unilateral na polia":"Tríceps",
  "Agachamento no Smith":"Quadríceps",
  "Leg press horizontal":"Quadríceps",
  "Cadeira extensora":"Quadríceps",
  "Cadeira flexora":"Posteriores",
  "Panturrilha no leg press":"Panturrilha",
  "Cadeira adutora":"Adutores",
  "Rosca alternada com halteres":"Bíceps",
  "Puxada alta neutra":"Costas",
  "Stiff com barra":"Posteriores",
  "Mesa flexora":"Posteriores",
  "RDL na polia baixa":"Posteriores",
  "Cadeira abdutora":"Abdutores",
  "Abdução com cabo":"Abdutores",
  "Remada baixa":"Costas",
  "Remada alta":"Ombros",
  "Supino inclinado na máquina":"Peito",
  "Elevação lateral":"Ombros",
  "Afundo no Smith":"Quadríceps",
  "Flexão de joelho no cabo":"Posteriores",
  "Elevação pélvica":"Glúteos",
  "Gêmeos no leg press":"Panturrilha",
  "Desenvolvimento com halteres":"Ombros",
  "Remada articulada":"Costas",
  "Tríceps testa polia":"Tríceps",
  "Afundo com halteres":"Quadríceps",
  "Elevação pélvica na máquina":"Glúteos"
 };

 const libraryNames=new Set(
  data.exerciseLibrary
   .map(x=>String(x.name||"").trim().toLowerCase())
 );

 Object.entries(standardLibraryExercises).forEach(([name,category])=>{
  const key=name.toLowerCase();
  if(libraryNames.has(key))return;

  data.exerciseLibrary.push({
   id:uid(),
   name,
   category,
   image:"",
   images:[],
   video:""
  });

  libraryNames.add(key);
 });

 if(!Array.isArray(data.developerNotifications))
  data.developerNotifications=[];

 data.developerNotifications=data.developerNotifications
  .filter(Boolean)
  .map(x=>({
   id:x.id||uid(),
   type:x.type||"novo_exercicio",
   exerciseId:x.exerciseId||"",
   name:x.name||"",
   category:x.category||"",
   createdAt:x.createdAt||new Date().toISOString(),
   resolved:!!x.resolved
  }));

 data.profiles.forEach(p=>{

  if(p.id==="natielle")
   p.gender="feminino";
  else if(p.id==="rafael"&&!p.gender)
   p.gender="masculino";
  else if(p.gender!=="feminino"&&p.gender!=="masculino")
   p.gender="masculino";

  if(!p.routines||typeof p.routines!=="object")
   p.routines={};

  Object.keys(p.routines).forEach(k=>{

   const r=p.routines[k];

   if(!r||typeof r!=="object"){

    delete p.routines[k];
    return;

   }

   r.description=typeof r.description==="string"?r.description.trim():"";

   r.ex=Array.isArray(r.ex)
    ?r.ex.map(normalizeExercise).map(ex=>{
       const n=String(ex.name||"").trim().toLowerCase();
       if(n==="agachamento") ex.name="Agachamento no Smith";
       if(n==="remada neutra máquina") ex.name="Remada neutra na máquina";
       return ex;
     })
    :[];

  });

 });

 let rafael=data.profiles.find(
  p=>p.id==="rafael"
 );

 if(!rafael){

  rafael={

   id:"rafael",
   name:"Rafael",
   photo:"",
   gender:"masculino",

   routines:getRafaelRoutines()

  };

  data.profiles.unshift(rafael);

 }else{

  if(!rafael.routines||typeof rafael.routines!=="object")
   rafael.routines={};

 }

 if(!data.profiles.some(
  p=>p.id==="natielle"
 )){

  data.profiles.push({

   id:"natielle",
   name:"Natielle",
   photo:"",
   gender:"feminino",
   routines:getNatielleRoutines()

  });

 }

 /* PERFIL DO ERICK */

 let erickProfile=data.profiles.find(
  p=>p.id==="erick" || String(p.name||"").trim().toLowerCase()==="erick"
 );

 if(!erickProfile){

  erickProfile={

   id:"erick",
   name:"Erick",
   photo:"",
   gender:"masculino",
   routines:getRafaelRoutines()

  };

  data.profiles.push(erickProfile);

 }else{

  erickProfile.id="erick";
  erickProfile.name="Erick";
  erickProfile.gender="masculino";

 }

 /* PERFIL DA RAFAELLE */

 let rafaelle=data.profiles.find(
  p=>p.id==="rafaelle"
 );

 if(!rafaelle){

  rafaelle={

   id:"rafaelle",
   name:"Rafaelle",
   photo:"",
   gender:"feminino",
   routines:getNatielleRoutines()

  };

  data.profiles.push(rafaelle);

 }else{

  rafaelle.name="Rafaelle";
  rafaelle.gender="feminino";

  if(!rafaelle.routines||typeof rafaelle.routines!=="object")
   rafaelle.routines=getNatielleRoutines();

 }

 /* SUBSTITUIÇÃO DAS FICHAS PADRÃO */

 if(data.routineSetVersion!==ROUTINE_SET_VERSION){

  const r=data.profiles.find(p=>p.id==="rafael");
  const n=data.profiles.find(p=>p.id==="natielle");

  if(r) r.routines=getRafaelRoutines();
  if(n) n.routines=getNatielleRoutines();

  data.routineSetVersion=ROUTINE_SET_VERSION;

 }

 /*
  * FICHAS FAMILIARES
  * Erick recebe uma cópia das fichas de Rafael.
  * Rafaelle recebe uma cópia das fichas de Natielle.
  * A cópia é estrutural: não compartilha o mesmo objeto em memória.
  */

 const rafaelProfile=data.profiles.find(
  p=>p.id==="rafael"
 );

 erickProfile=data.profiles.find(
  p=>p.id==="erick"
 );

 if(erickProfile&&rafaelProfile){

  erickProfile.routines=clone(rafaelProfile.routines);

  if(erickProfile.gender!=="feminino"&&erickProfile.gender!=="masculino")
   erickProfile.gender="masculino";

 }


 const natielleProfile=data.profiles.find(
  p=>p.id==="natielle"
 );

 if(rafaelle&&natielleProfile){

  rafaelle.routines=clone(natielleProfile.routines);

 }

 data.routineFamilySetVersion="2026-10-05-v1";

 const savedDefault=
  storageGet("treinoRafaelDefaultProfile");

 if(
  !data.currentProfile ||
  !data.profiles.some(
   p=>p.id===data.currentProfile
  )
 ){

  data.currentProfile=
   savedDefault||
   "rafael";

 }

 if(!data.profiles.some(
  p=>p.id===data.currentProfile
 )){

  data.currentProfile="rafael";

 }

 /* MIGRAÇÃO ANTIGA */

 try{

  const oldRaw=storageGet(OLDKEY);

  const old=oldRaw
   ?JSON.parse(oldRaw)
   :null;

  if(
   Array.isArray(old)&&
   !data._oldMigrated
  ){

   old.forEach(item=>{

    data.history.push({

     id:uid(),
     profileId:"rafael",
     workout:item.workout||"A",
     date:item.date||"",
     weight:item.weight||"",
     duration:item.duration||"",
     calories:item.calories||"",
     exercises:item.exercises||[]

    });

   });

   data._oldMigrated=true;

  }

 }catch(e){

  console.warn(
   "Migração antiga não realizada.",
   e
  );

 }

 storageSet(
  DBKEY,
  JSON.stringify(data)
 );

 return data;

}

   ESTADO

let db=readDB();
let currentRoutine=null;

function getProfile(){

 return db.profiles.find(
  p=>p.id===db.currentProfile
 )||db.profiles[0]||null;

}

function getRoutine(){

 const p=getProfile();

 return p&&currentRoutine
  ?p.routines[currentRoutine]||null
  :null;

}

function getRecommendedRoutineId(p){

 if(!p||!p.routines)return null;

 const ids=Object.keys(p.routines);
 if(!ids.length)return null;

 const last=db.history
  .filter(x=>x.profileId===p.id && x.workout && p.routines[x.workout])
  .slice(-1)[0];

 if(!last)return ids[0];

 const index=ids.indexOf(last.workout);
 if(index<0)return ids[0];

 return ids[(index+1)%ids.length];

}

 setTab("");

   ?`<img src="${esc(p.photo)}" alt="Foto de ${esc(p.name)}">`

 app.innerHTML=`

 <div class="home-page">

   </p>

   </p>

  </div>

  ${(()=>{
    const nextId=getRecommendedRoutineId(p);
    const next=nextId&&p.routines[nextId];
    const entries=db.history
      .filter(x=>x.profileId===p.id && x.workout)
      .sort((a,b)=>String(b.date||'').localeCompare(String(a.date||'')));
    const last=entries[0]||null;
    const exerciseCount=next&&Array.isArray(next.ex)?next.ex.length:0;
    const lastDate=last?.date?formatDate(last.date):"Ainda não realizado";
    const lastDuration=last?.duration?String(last.duration):"—";
    const monthDate=new Date();
    const year=monthDate.getFullYear();
    const month=monthDate.getMonth();
    const monthName=monthDate.toLocaleDateString('pt-BR',{month:'long',year:'numeric'});
    const firstDay=new Date(year,month,1).getDay();
    const mondayOffset=(firstDay+6)%7;
    const daysInMonth=new Date(year,month+1,0).getDate();
    const workoutDates=new Set(entries.filter(x=>String(x.date||'').startsWith(`${year}-${String(month+1).padStart(2,'0')}-`)).map(x=>x.date));
    const todayKey=today();
    const weekdays=['SEG','TER','QUA','QUI','SEX','SÁB','DOM'];

    for(let i=0;i<mondayOffset;i++) calendar+='<div class="home-calendar-day empty">0</div>';
    for(let day=1;day<=daysInMonth;day++){
      const key=`${year}-${String(month+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
      const isWorkout=workoutDates.has(key);
      const isToday=key===todayKey;
      calendar+=`<div class="home-calendar-day ${isWorkout?'workout':''} ${isToday?'today':''}">${day}${isWorkout?'<span class="home-calendar-dot"></span>':''}</div>`;
    }
    return `
    <div class="home-dashboard">
      <div class="home-calendar-card">
        <div class="home-calendar-head">
          <h3>Calendário de treinos</h3>
          <span class="home-calendar-month">${monthName}</span>
        </div>
        <div class="home-calendar-grid">${calendar}</div>
        <div class="home-calendar-legend"><span class="home-calendar-legend-dot"></span> dia com treino realizado</div>
      </div>

      <button type="button" class="home-training-panel" onclick="${next?`chooseRoutine('${esc(nextId)}')`:''}">
        <div class="home-training-head">
          <div>
            <h3 class="home-next-name">${next?esc(next.name):'Nenhuma ficha cadastrada'}</h3>
            ${next?.description?`<div class="home-next-description">${esc(next.description)}</div>`:''}
          </div>
          ${next?'<span class="home-recommended-label">Recomendado</span>':''}
        </div>
        <div class="home-stats">
          <div class="home-stat">
            <span class="home-stat-label">Exercícios</span>
            <span class="home-stat-value">${exerciseCount}</span>
          </div>
          <div class="home-stat">
            <span class="home-stat-label">Último treino</span>
            <span class="home-stat-value">${lastDate}</span>
          </div>
          <div class="home-stat">
            <span class="home-stat-label">Duração do último</span>
            <span class="home-stat-value">${esc(lastDuration)}</span>
          </div>
          <div class="home-stat">
            <span class="home-stat-label">Treinos realizados</span>
            <span class="home-stat-value">${entries.length}</span>
          </div>
        </div>
        <div class="home-motivation">Constância hoje. Resultado amanhã. 💪</div>
      </button>
    </div>`;
  })()}

 </div>`;

}

  const el=document.getElementById(x);

function trainingDraftKey(){
 const p=getProfile();
 return p&&currentRoutine
  ?p.id+"::"+currentRoutine
  :"";
}

function newTrainingDraft(r){
 return {
  id:uid(),
  profileId:getProfile()?.id||"",
  workout:currentRoutine,
  date:today(),
  weight:"",
  duration:"",
  calories:"",
  exercises:(r.ex||[]).map(e=>({
   completed:false,
   sets:Array.from({length:Math.max(1,Number(e.series||3))},()=>({load:"",reps:""})),
   observation:"",
   targetLoad:e.targetLoad??"",
   targetReps:e.targetReps??""
  }))
 };
}

function getTrainingDraft(){
 const r=getRoutine();
 const key=trainingDraftKey();
 if(!r||!key)return null;

 if(!db.activeWorkouts[key])
  db.activeWorkouts[key]=newTrainingDraft(r);

 const d=db.activeWorkouts[key];
 if(!Array.isArray(d.exercises))d.exercises=[];

 d.exercises=(r.ex||[]).map((e,i)=>{
  const old=d.exercises[i]||{};
  const count=Math.max(1,Number(e.series||3));
  const sets=Array.isArray(old.sets)?old.sets.slice(0,count):[];
  while(sets.length<count)sets.push({load:"",reps:""});
  return {
   completed:!!old.completed,
   sets:sets.map(x=>({load:x?.load??"",reps:x?.reps??""})),
   observation:old.observation??"",
   targetLoad:old.targetLoad??e.targetLoad??"",
   targetReps:old.targetReps??e.targetReps??""
  };
 });

 return d;
}

function saveTrainingDraftFromDOM(){
 const r=getRoutine();
 const d=getTrainingDraft();
 if(!r||!d)return;

 const val=id=>document.getElementById(id)?.value??"";
 d.date=val("data")||d.date||today();
 d.weight=val("peso");
 d.duration=val("duracao");
 d.calories=val("calorias");

 r.ex.forEach((e,i)=>{
  const x=d.exercises[i];
  if(!x)return;
  x.targetLoad=val("tL"+i);
  x.targetReps=val("tR"+i);
  x.observation=val("o"+i);
  x.sets=x.sets.map((set,n)=>({
   load:val("c"+i+n),
   reps:val("r"+i+n)
  }));
 });

 saveDB();
}

function repClass(value,e){
 const n=Number(value);
 if(value===""||value==null||Number.isNaN(n))return "";
 const hasMin=e.minReps!==""&&e.minReps!=null&&!Number.isNaN(Number(e.minReps));
 const hasMax=e.maxReps!==""&&e.maxReps!=null&&!Number.isNaN(Number(e.maxReps));
 const min=Number(e.minReps);
 const max=Number(e.maxReps);
 if(hasMin&&n<min)return "rep-low";
 if(hasMax&&n>max)return "rep-max";
 if(hasMin||hasMax)return "rep-ok";
 return "";
}

function toggleExerciseDone(index){
 const card=document.querySelector(`[data-exercise-index="${index}"]`);
 const before=card?.getBoundingClientRect();
 saveTrainingDraftFromDOM();
 const d=getTrainingDraft();
 if(!d?.exercises[index])return;
 d.exercises[index].completed=!d.exercises[index].completed;
 saveDB();

 const all=d.exercises.length>0&&d.exercises.every(x=>x.completed);
 if(all){
  setTimeout(()=>{
   alert("Parabéns, treino finalizado com sucesso!");
   finalizeWorkout(true);
  },850);
 }else{
  showTraining();
  requestAnimationFrame(()=>{
   const moved=document.querySelector(`[data-exercise-index="${index}"]`);
   if(!moved||!before)return;
   const after=moved.getBoundingClientRect();
   const dx=before.left-after.left;
   const dy=before.top-after.top;
   const sx=before.width/after.width;
   const sy=before.height/after.height;
   moved.classList.add('completed-slide-target');
   moved.style.transformOrigin='top left';
   moved.style.transform=`translate(${dx}px,${dy}px) scale(${sx},${sy})`;
   moved.style.opacity='1';
   moved.offsetHeight;
   moved.style.transition='transform 2200ms cubic-bezier(.22,.61,.36,1)';
   moved.style.transform='translate(0,0) scale(1,1)';
   moved.addEventListener('transitionend',()=>{
    moved.style.transition='';
    moved.classList.remove('completed-slide-target');
   },{once:true});
  });
 }
}

  </div>
 </div>`;

 function renderExercise(x){
  const e=x.e,i=x.i, state=d.exercises[i]||{}, locked=!!state.completed;
  const sets=state.sets||[];
  let block=`
  <div class="card exercise ${locked?'completed-exercise':''}" data-exercise-index="${i}">
   <div class="exercise-main-row">
    <h3>${formatExerciseName(e.name,i)}</h3>
    ${exerciseAnimationHtml(e)}
    <label id="doneRow${i}" class="exercise-complete${locked?' done':''}" title="${locked?'Desmarcar exercício':'Marcar exercício como concluído'}">
     <input id="done${i}" type="checkbox" ${locked?'checked':''} onchange="toggleExerciseDone(${i})">
    </label>
   </div>
   <div class="last">Última S1: ${e.refLoad!==""&&e.refLoad!=null?esc(e.refLoad)+" kg × "+esc(e.refReps||"-")+" reps":"sem registro"}</div>
   <div class="target">

    <div class="grid" style="margin-top:7px">
     <div><label>Carga alvo</label><input id="tL${i}" type="number" step="0.5" value="${esc(state.targetLoad??e.targetLoad??"")}" ${locked?'disabled':''} oninput="saveTrainingDraftFromDOM()"></div>
     <div><label>Reps alvo</label><input id="tR${i}" type="number" value="${esc(state.targetReps??e.targetReps??"")}" ${locked?'disabled':''} oninput="saveTrainingDraftFromDOM()"></div>
    </div>
   </div>
   <div class="grid">`;
  sets.forEach((set,n)=>{
   block+=`<div><label>Série ${n+1} — carga</label><input id="c${i}${n}" type="number" step="0.5" value="${esc(set.load)}" ${locked?'disabled':''} oninput="saveTrainingDraftFromDOM()"></div>
   <div><label>Série ${n+1} — reps</label><input class="${repClass(set.reps,e)}" id="r${i}${n}" type="number" value="${esc(set.reps)}" ${locked?'disabled':''} oninput="this.className=repClass(this.value,db.profiles.find(p=>p.id===db.currentProfile).routines[currentRoutine].ex[${i}]);saveTrainingDraftFromDOM()"></div>`;
  });
  block+=`</div>`;
  if(e.minReps!==""||e.maxReps!=="")block+=`<div class="small" style="margin-top:8px">Faixa de repetições: ${e.minReps!==""?"mín. "+esc(e.minReps):""}${e.minReps!==""&&e.maxReps!==""?" • ":""}${e.maxReps!==""?"máx. "+esc(e.maxReps):""}</div>`;
  block+=`<br><label>Observação</label><input id="o${i}" type="text" value="${esc(state.observation)}" placeholder="Opcional" ${locked?'disabled':''} oninput="saveTrainingDraftFromDOM()"></div>`;

 }

 if(pending.length){

 }

 html+=`<button class="primary" onclick="finalizeWorkout(false)">✅ Finalizar treino</button>`;

}

function finalizeWorkout(automatic){
 saveTrainingDraftFromDOM();
 const p=getProfile(),r=getRoutine(),key=trainingDraftKey(),d=db.activeWorkouts[key];
 if(!p||!r||!d)return;

 const entry={id:uid(),profileId:p.id,workout:currentRoutine,date:d.date||today(),weight:d.weight||"",duration:d.duration||"",calories:d.calories||"",exercises:[]};
 r.ex.forEach((e,i)=>{
  const x=d.exercises[i]||{sets:[]};
  const sets=(x.sets||[]).map(s=>({load:s.load??"",reps:s.reps??""}));
  entry.exercises.push({name:e.name,refBefore:{load:e.refLoad??"",reps:e.refReps??""},sets,observation:x.observation||"",nextTarget:{load:x.targetLoad??"",reps:x.targetReps??""},completed:!!x.completed});
  e.targetLoad=x.targetLoad??"";
  e.targetReps=x.targetReps??"";
  const first=sets.find(s=>s.load!==""||s.reps!=="");
  if(first?.load!==""){e.refLoad=first.load;e.refReps=first.reps;}
 });

 db.history.push(entry);
 if(entry.weight){
  const same=db.evolution.find(x=>x.profileId===p.id&&x.date===entry.date);
  if(same)same.weight=entry.weight;
  else db.evolution.push({id:uid(),profileId:p.id,date:entry.date,weight:entry.weight,waist:"",abdomen:"",photos:[]});
 }
 delete db.activeWorkouts[key];
 saveDB();

 app.innerHTML=`<div class="card success"><h2>${automatic?'Parabéns, treino finalizado com sucesso! 🎉':'Treino finalizado e salvo! ✅'}</h2><p>O treino de <strong>${esc(p.name)}</strong> entrou no histórico.</p><button class="primary" onclick="exportWorkout('${entry.id}')">📤 Exportar treino do dia</button><br><br><button class="secondary" onclick="showTraining()">↩️ Voltar ao treino</button></div>`;
}

   ========================================================= */

function addEvolutionPhotos(id){

 const record=db.evolution.find(
  x=>x.id===id
 );

 if(!record)return;

 const currentPhotos=
  Array.isArray(record.photos)
   ?record.photos
   :[];

 if(currentPhotos.length>=3){

  alert(
   "Este registro já possui 3 fotos."
  );

  return;

 }

 const remaining=
  3-currentPhotos.length;

 const input=document.createElement(
  "input"
 );

 input.type="file";
 input.accept="image/*";
 input.multiple=true;

 input.onchange=()=>{

  const files=[
   ...input.files
  ].slice(0,remaining);

  if(!files.length){

   if(input.parentNode)
    input.remove();

   return;

  }

  const newPhotos=[];

  let left=files.length;

  files.forEach(file=>{

   const rd=new FileReader();

   rd.onload=()=>{

    newPhotos.push({

     name:file.name,
     data:rd.result

    });

    left--;

    if(left===0){

     record.photos=[

      ...currentPhotos,
      ...newPhotos

     ].slice(0,3);

     saveDB();

     if(input.parentNode)
      input.remove();

     showEvolution();

    }

   };

   rd.onerror=()=>{

    left--;

    if(left===0){

     if(input.parentNode)
      input.remove();

     showEvolution();

    }

   };

   rd.readAsDataURL(file);

  });

 };

 document.body.appendChild(input);

 input.click();

}

function addLibraryExercise(){

 const name=prompt(
  "Digite o nome do exercício:"
 );

 if(!name?.trim())return;

 const categories=
  db.exerciseCategories||
  DEFAULT_CATEGORIES;

 const list=categories
  .map(
   (c,i)=>`${i+1} - ${c}`
  )
  .join("\n");

 const choice=prompt(

  "Escolha a categoria:\n\n"+
  list+
  "\n\nDigite o número."

 );

 if(!choice)return;

 let cat=
  categories[
   Number(choice)-1
  ];

 if(!cat){

  const nc=prompt(
   "Digite o nome da nova categoria:"
  );

  if(!nc?.trim())return;

  cat=nc.trim();

  if(!categories.some(
   c=>
    c.toLowerCase()===
    cat.toLowerCase()
  )){

   db.exerciseCategories.push(cat);

  }

 }

 /*
  * O cadastro do exercício não pede instruções nem URLs de mídia.
  * A animação é responsabilidade do desenvolvedor e será vinculada
  * posteriormente à biblioteca de animações do aplicativo.
  */
 const newExercise={

  id:uid(),
  name:name.trim(),
  category:cat,
  image:"",
  images:[],
  video:""

 };

 db.exerciseLibrary.push(newExercise);

 if(!EXERCISE_ANIMATIONS[String(newExercise.name||"").trim().toLowerCase()])
  addDeveloperNotification(newExercise);

 saveDB();
 showConfig();

}

function editLibraryMedia(id){

 const ex=db.exerciseLibrary.find(
  x=>x.id===id
 );

 if(!ex)return;

 const image=prompt(
  "URL da imagem principal:",
  ex.image||""
 );

 if(image===null)return;

 const video=prompt(
  "URL do vídeo de execução:",
  ex.video||""
 );

 if(video===null)return;

 const extra=prompt(
  "URLs de outras imagens, separadas por |:",
  (ex.images||[]).join("|")
 );

 if(extra===null)return;

 ex.image=image.trim();

 ex.video=video.trim();

 ex.images=extra
  .split("|")
  .map(x=>x.trim())
  .filter(Boolean)
  .slice(0,3);

 db.profiles.forEach(p=>

  Object.values(p.routines||{})
  .forEach(r=>

   r.ex.forEach(e=>{

    if(
     e.name===ex.name&&
     e.category===ex.category
    ){

     e.image=ex.image;
     e.images=clone(ex.images);
     e.video=ex.video;

    }

   })

  )

 );

 saveDB();
 showConfig();

}

   FICHAS
   ========================================================= */

function getRoutineInfoOptions(){
 return [
  {label:"Corpo todo",complete:true},
  {label:"Superiores completo",complete:true},
  {label:"Pernas completo",complete:true},
  {label:"Costas"},
  {label:"Peito"},
  {label:"Bíceps"},
  {label:"Tríceps"},
  {label:"Frontal de ombro"},
  {label:"Lateral de ombro"},
  {label:"Posterior de ombro"},
  {label:"Abdômen"},
  {label:"Quadrícepis"},
  {label:"Adutores"},
  {label:"Abdutores"},
  {label:"Gluteos"},
  {label:"Posterior de coxa"},
  {label:"Panturrilha"}
 ];
}

let routineFormEditId=null;
let routineInfoDraft=[];
let routineCustomInfoDraft=[];

function openRoutineForm(editId=null){
 const p=getProfile();
 if(!p)return;
 routineFormEditId=editId;
 const r=editId?p.routines[editId]:null;
 const selected=Array.isArray(r?.basicInfo)&&r.basicInfo.length
  ? r.basicInfo.slice()
  : (r?.description?r.description.split(/\s*,\s*/).filter(Boolean):[]);
 routineInfoDraft=[...selected];
 routineCustomInfoDraft=selected.filter(x=>!getRoutineInfoOptions().some(o=>o.label===x));

 const host=document.getElementById('app');
 const title=r?'Editar ficha de treino':'Nova ficha de treino';
 const safeName=r?.name||'';
 host.innerHTML=`
  <div class="card">
   <button type="button" class="back-to-routines" onclick="showConfig()">‹&nbsp; voltar para configurações</button>
   <div class="routine-form">
    <h3>${title}</h3>
    <p class="routine-form-subtitle">Cadastre a ficha como um formulário completo. As informações básicas ajudam a identificar os grupos musculares do treino.</p>

    <div class="routine-form-field">
     <label for="routineFormName">Nome da ficha</label>
     <input id="routineFormName" value="${esc(safeName)}" placeholder="Ex.: Treino A">
    </div>

    <div class="routine-form-field">
     <label>Informações básicas</label>
     <button type="button" class="routine-basic-info-button" onclick="openRoutineInfoModal()">
      <span>
       <strong>Selecionar informações</strong><br>
       <span id="routineInfoSummary" class="summary"></span>
      </span>
      <span>›</span>
     </button>
    </div>

    <div class="routine-form-actions">
     <button type="button" class="secondary" onclick="showConfig()">Cancelar</button>
     <button type="button" class="primary" onclick="saveRoutineForm()">Salvar ficha</button>
    </div>
   </div>
  </div>`;
 updateRoutineInfoSummary();
}

function updateRoutineInfoSummary(){
 const el=document.getElementById('routineInfoSummary');
 if(!el)return;
 const values=[...routineInfoDraft];
 el.textContent=values.length?values.join(', '):'Nenhuma informação selecionada';
}

function openRoutineInfoModal(){
 let modal=document.getElementById('routineInfoModal');
 if(!modal){
  modal=document.createElement('div');
  modal.id='routineInfoModal';
  modal.className='routine-info-modal';
  document.body.appendChild(modal);
 }
 const options=getRoutineInfoOptions();
 const allCustom=routineCustomInfoDraft.slice();
 modal.innerHTML=`
  <div class="routine-info-sheet" role="dialog" aria-modal="true">
   <div class="routine-info-sheet-header">
    <h3>Informações básicas</h3>
    <button type="button" class="routine-info-close" onclick="closeRoutineInfoModal()">×</button>
   </div>
   <p class="routine-info-help">Selecione uma ou várias opções que fazem parte deste treino.</p>
   <div class="routine-info-grid">
    ${options.map(o=>{
      const checked=routineInfoDraft.includes(o.label)?'checked':'';
      return `<label class="routine-info-option ${o.complete?'complete':''}">
       <input type="checkbox" value="${esc(o.label)}" ${checked} onchange="toggleRoutineInfoOption(this)">
       <span>${esc(o.label)}</span>
      </label>`;
    }).join('')}
   </div>
   <div class="routine-custom-info">
    <strong>Criar nova informação</strong>
    <p class="routine-info-help" style="margin-top:5px">Adicione uma informação que não esteja na lista.</p>
    <div class="routine-custom-info-row">
     <input id="routineCustomInfoInput" placeholder="Ex.: Lombar">
     <button type="button" class="secondary" onclick="addCustomRoutineInfo()">+ Adicionar</button>
    </div>
    <div class="routine-custom-list">
     ${allCustom.map(v=>`<span class="routine-custom-tag">${esc(v)} <button type="button" onclick="removeCustomRoutineInfo('${esc(v)}')">×</button></span>`).join('')}
    </div>
   </div>
   <div class="routine-info-footer">
    <button type="button" class="secondary" onclick="closeRoutineInfoModal()">Cancelar</button>
    <button type="button" class="primary" onclick="applyRoutineInfoSelection()">Confirmar seleção</button>
   </div>
  </div>`;
 modal.classList.add('open');
 modal.onclick=e=>{if(e.target===modal)closeRoutineInfoModal();};
}

function toggleRoutineInfoOption(input){
 const value=input.value;
 if(input.checked){
  if(!routineInfoDraft.includes(value))routineInfoDraft.push(value);
 }else{
  routineInfoDraft=routineInfoDraft.filter(v=>v!==value);
 }
}

function addCustomRoutineInfo(){
 const input=document.getElementById('routineCustomInfoInput');
 const value=(input?.value||'').trim();
 if(!value)return;
 if(!routineCustomInfoDraft.includes(value))routineCustomInfoDraft.push(value);
 if(!routineInfoDraft.includes(value))routineInfoDraft.push(value);
 openRoutineInfoModal();
}

function removeCustomRoutineInfo(value){
 routineCustomInfoDraft=routineCustomInfoDraft.filter(v=>v!==value);
 routineInfoDraft=routineInfoDraft.filter(v=>v!==value);
 openRoutineInfoModal();
}

function applyRoutineInfoSelection(){
 closeRoutineInfoModal();
 updateRoutineInfoSummary();
}

function closeRoutineInfoModal(){
 const modal=document.getElementById('routineInfoModal');
 if(modal)modal.classList.remove('open');
}

function saveRoutineForm(){
 const name=(document.getElementById('routineFormName')?.value||'').trim();
 if(!name){alert('Digite o nome da ficha.');return;}
 const p=getProfile();
 if(!p)return;
 let id=routineFormEditId;
 if(!id){
  id=slug(name);
  if(p.routines[id])id+='-'+Date.now();
  p.routines[id]={id,name,description:routineInfoDraft.join(', '),basicInfo:routineInfoDraft.slice(),ex:[]};
 }else{
  const r=p.routines[id];
  if(!r)return;
  r.name=name;
  r.description=routineInfoDraft.join(', ');
  r.basicInfo=routineInfoDraft.slice();
 }
 currentRoutine=null;
 saveDB();
 showConfig();
}

function addRoutine(){
 openRoutineForm();
}

/* =========================================================
   IMPORTAR FICHA
   ========================================================= */

function importRoutine(){

 const current=getProfile();

 const others=db.profiles.filter(
  p=>p.id!==current.id
 );

 if(!others.length){

  alert(
   "Não há outro perfil para importar uma ficha."
  );

  return;

 }

 const pc=prompt(

  "De qual perfil você quer importar?\n\n"+

  others
   .map(
    (p,i)=>`${i+1} - ${p.name}`
   )
   .join("\n")

 );

 if(!pc)return;

 const source=
  others[
   Number(pc)-1
  ];

 if(!source){

  alert(
   "Perfil inválido."
  );

  return;

 }

 const routines=
  Object.values(
   source.routines||{}
  );

 if(!routines.length){

  alert(
   "Esse perfil ainda não possui fichas."
  );

  return;

 }

 const rc=prompt(

  "Qual ficha você deseja importar?\n\n"+

  routines
   .map(
    (r,i)=>`${i+1} - ${r.name}`
   )
   .join("\n")

 );

 if(!rc)return;

 const sr=
  routines[
   Number(rc)-1
  ];

 if(!sr){

  alert(
   "Ficha inválida."
  );

  return;

 }

 let name=
  sr.name+" (importada)";

 let id=slug(name);

 if(current.routines[id])
  id+="_"+Date.now();

 current.routines[id]={

  id,
  name,
  description:sr.description||"",

  ex:(sr.ex||[]).map(e=>({

   name:e.name||"",
   category:e.category||"",
   image:e.image||"",
   images:clone(e.images||[]),
   video:e.video||"",
   targetLoad:"",
   targetReps:"",
   series:Number(e.series||3),
   minReps:e.minReps??"",
   maxReps:e.maxReps??"",
   refLoad:"",
   refReps:""

  }))

 };

 currentRoutine=id;

 saveDB();
 showConfig();

 alert(
  "Ficha importada com sucesso. As cargas, repetições e referências começaram em branco."
 );

}

function editRoutine(id){
 openRoutineForm(id);
}

function deleteRoutine(id){

 const p=getProfile();

 if(!confirm(
  "Excluir esta ficha?"
 ))return;

 delete p.routines[id];

 currentRoutine=
  Object.keys(p.routines)[0]||null;

 saveDB();
 showConfig();

}

/* =========================================================
   BACKUP
   ========================================================= */

function downloadJSON(data,filename){

 const blob=new Blob(

  [
   JSON.stringify(
    data,
    null,
    2
   )
  ],

  {
   type:"application/json"
  }

 );

 const url=
  URL.createObjectURL(blob);

 const a=
  document.createElement("a");

 a.href=url;
 a.download=filename;

 document.body.appendChild(a);

 a.click();

 a.remove();

 setTimeout(
  ()=>URL.revokeObjectURL(url),
  1000
 );

}

function exportProfile(){

 const p=getProfile();

 if(!p)return;

 downloadJSON(

  {

   tipo:"perfil",

   exportadoEm:
    new Date().toISOString(),

   profile:clone(p),

   history:
    db.history.filter(
     x=>x.profileId===p.id
    ),

   evolution:
    db.evolution.filter(
     x=>x.profileId===p.id
    )

  },

  "backup-"+
  slug(p.name)+
  ".json"

 );

}

function exportAll(){

 downloadJSON(

  {

   tipo:"backup-completo",

   exportadoEm:
    new Date().toISOString(),

   database:clone(db)

  },

  "backup-treinos-completo.json"

 );

}
