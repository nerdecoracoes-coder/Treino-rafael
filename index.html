<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Treino Rafael</title>

<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f3f4f6;
  color:#111827;
}
header{
  background:#111827;
  color:white;
  padding:18px 16px;
  text-align:center;
}
header h1{margin:0;font-size:22px}
nav{
  display:flex;
  background:white;
  border-bottom:1px solid #ddd;
}
nav button{
  flex:1;
  padding:14px 5px;
  border:0;
  background:white;
  font-weight:bold;
  color:#555;
}
nav button.active{
  color:#2563eb;
  border-bottom:3px solid #2563eb;
}
main{
  max-width:700px;
  margin:auto;
  padding:12px;
}
.card{
  background:white;
  border-radius:12px;
  padding:15px;
  margin-bottom:12px;
  box-shadow:0 1px 4px #0001;
}
.exercise h3{
  margin:0 0 5px;
  font-size:17px;
}
.last{
  color:#2563eb;
  font-size:13px;
  margin-bottom:12px;
}
.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
}
label{
  display:block;
  font-size:12px;
  color:#666;
  margin-bottom:4px;
}
input{
  width:100%;
  padding:10px;
  border:1px solid #d1d5db;
  border-radius:8px;
  font-size:16px;
}
button{
  cursor:pointer;
}
.primary{
  width:100%;
  padding:14px;
  border:0;
  border-radius:10px;
  background:#2563eb;
  color:white;
  font-size:17px;
  font-weight:bold;
}
.secondary{
  padding:10px;
  border:0;
  border-radius:8px;
  background:#e5e7eb;
  font-weight:bold;
}
.muted{
  color:#6b7280;
  font-size:13px;
}
.success{
  text-align:center;
}
.history-item{
  border-top:1px solid #eee;
  padding:12px 0;
}
</style>
</head>

  <button id="btnB" onclick="showWorkout('B')">Treino B</button>
  <button id="btnH" onclick="showHistory()">Histórico</button>
</nav>

<main id="app"></main>

function setActive(tab){

document.getElementById("btnA").classList.remove("active");
document.getElementById("btnB").classList.remove("active");
document.getElementById("btnH").classList.remove("active");

document.getElementById(tab).classList.add("active");

}

function showWorkout(type){

current = type;

setActive(type === "A" ? "btnA" : "btnB");

</div>

<div>
<label>Data</label>

</div>

</div>

<label>Série 1 — carga</label>
<input id="c${index}1" type="number" step="0.5">
</div>

<div>

<input id="r${index}1" type="number">
</div>

<div>

<input id="c${index}2" type="number" step="0.5">
</div>

<div>
<label>Série 2 — reps</label>
<input id="r${index}2" type="number">
</div>

<div>
<label>Série 3 — carga</label>
<input id="c${index}3" type="number" step="0.5">
</div>

<div>
<label>Série 3 — reps</label>
<input id="r${index}3" type="number">
</div>

</div>

<br>

<label>Observação</label>
<input id="o${index}" type="text" placeholder="Opcional">

</div>
`;

});

html += `
<button class="primary" onclick="saveWorkout()">
✅ Salvar treino
</button>
`;

document.getElementById("app").innerHTML = html;

}
