<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Treino Rafael</title>

<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f3f4f6;
  color:#111827;
}
header{
  background:#111827;
  color:white;
  padding:18px 16px;
  text-align:center;
}
header h1{margin:0;font-size:22px}
nav{
  display:flex;
  background:white;
  border-bottom:1px solid #ddd;
}
nav button{
  flex:1;
  padding:14px 5px;
  border:0;
  background:white;
  font-weight:bold;
  color:#555;
}
nav button.active{
  color:#2563eb;
  border-bottom:3px solid #2563eb;
}
main{
  max-width:700px;
  margin:auto;
  padding:12px;
}
.card{
  background:white;
  border-radius:12px;
  padding:15px;
  margin-bottom:12px;
  box-shadow:0 1px 4px #0001;
}
.exercise h3{
  margin:0 0 5px;
  font-size:17px;
}
.last{
  color:#2563eb;
  font-size:13px;
  margin-bottom:12px;
}
.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
}
label{
  display:block;
  font-size:12px;
  color:#666;
  margin-bottom:4px;
}
input{
  width:100%;
  padding:10px;
  border:1px solid #d1d5db;
  border-radius:8px;
  font-size:16px;
}
button{
  cursor:pointer;
}
.primary{
  width:100%;
  padding:14px;
  border:0;
  border-radius:10px;
  background:#2563eb;
  color:white;
  font-size:17px;
  font-weight:bold;
}
.secondary{
  padding:10px;
  border:0;
  border-radius:8px;
  background:#e5e7eb;
  font-weight:bold;
}
.muted{
  color:#6b7280;
  font-size:13px;
}
.success{
  text-align:center;
}
.history-item{
  border-top:1px solid #eee;
  padding:12px 0;
}
</style>
</head>

<body>

<header>
  <h1>🏋️ Treino Rafael</h1>
</header>

<nav>
  <button id="btnA" onclick="showWorkout('A')">Treino A</button>
  <button id="btnB" onclick="showWorkout('B')">Treino B</button>
  <button id="btnH" onclick="showHistory()">Histórico</button>
</nav>

<main id="app"></main>

<script>

const key = "treinoRafaelHistorico";

const workouts = {

A: {
name:"Treino A — Costas, Bíceps e Pernas",
ex:[
["Agachamento",18,20],
["Puxada aberta na polia",52,15],
["Remada neutra máquina",59,15],
["Leg press máquina",117,20],
["Bíceps máquina",36,15],
["Cadeira extensora",59,15],
["Rosca martelo com halteres",10,12],
["Elevação lateral com halteres",8,12]
]
},

B: {
name:"Treino B — Peito, Tríceps, Ombros e Posterior",
ex:[
["Lombar na máquina",59,20],
["Crucifixo máquina",100,15],
["Supino reto máquina",50,15],
["Cadeira flexora",36,20],
["Desenvolvimento máquina",27,15],
["Cadeira abdutora",45,"—"],
["Tríceps polia corda",20,15],
["Tríceps francês corda",17,12],
["Elevação frontal",8,12],
["Elevação lateral",5,12]
]
}

};

let current = "A";

function setActive(tab){

document.getElementById("btnA").classList.remove("active");
document.getElementById("btnB").classList.remove("active");
document.getElementById("btnH").classList.remove("active");

document.getElementById(tab).classList.add("active");

}

function showWorkout(type){

current = type;

setActive(type === "A" ? "btnA" : "btnB");

let today = new Date().toISOString().slice(0,10);

let html = "";

html += `
<div class="card">
<h2>${workouts[type].name}</h2>
<p class="muted">
A carga azul é a referência usada no início da última sessão.
</p>

<div class="grid">

<div>
<label>Peso hoje (kg)</label>
<input id="peso" type="number" step="0.1">
</div>

<div>
<label>Duração (min)</label>
<input id="duracao" type="number">
</div>

<div>
<label>Calorias estimadas</label>
<input id="calorias" type="number">
</div>

<div>
<label>Data</label>
<input id="data" type="date" value="${today}">
</div>

</div>
</div>
`;

workouts[type].ex.forEach(function(ex,index){

html += `
<div class="card exercise">

<h3>${index + 1}. ${ex[0]}</h3>

<div class="last">
Referência: ${ex[1]} kg × ${ex[2]} reps
</div>

<div class="grid">

<div>
<label>Série 1 — carga</label>
<input id="c${index}1" type="number" step="0.5">
</div>

<div>
<label>Série 1 — reps</label>
<input id="r${index}1" type="number">
</div>

<div>
<label>Série 2 — carga</label>
<input id="c${index}2" type="number" step="0.5">
</div>

<div>
<label>Série 2 — reps</label>
<input id="r${index}2" type="number">
</div>

<div>
<label>Série 3 — carga</label>
<input id="c${index}3" type="number" step="0.5">
</div>

<div>
<label>Série 3 — reps</label>
<input id="r${index}3" type="number">
</div>

</div>

<br>

<label>Observação</label>
<input id="o${index}" type="text" placeholder="Opcional">

</div>
`;

});

html += `
<button class="primary" onclick="saveWorkout()">
✅ Salvar treino
</button>
`;

document.getElementById("app").innerHTML = html;

}

function saveWorkout(){

let entry = {

workout: current,

date: document.getElementById("data").value,
weight: document.getElementById("peso").value,
duration: document.getElementById("duracao").value,
calories: document.getElementById("calorias").value,
exercises: []
};

workouts[current].ex.forEach(function(ex,index){
entry.exercises.push({
name: ex[0],
sets:[
{
load: document.getElementById("c"+index+"1").value,
reps: document.getElementById("r"+index+"1").value
},
{
load: document.getElementById("c"+index+"2").value,
reps: document.getElementById("r"+index+"2").value
},
{
load: document.getElementById("c"+index+"3").value,
reps: document.getElementById("r"+index+"3").value
}
],
observation: document.getElementById("o"+index).value
});
});

let history = JSON.parse(localStorage.getItem(key) || "[]");
history.push(entry);
localStorage.setItem(key,JSON.stringify(history));

document.getElementById("app").innerHTML = `
<div class="card success">
<h2>Treino salvo! ✅</h2>
<p>Os dados foram gravados neste celular.</p>
<button class="secondary" onclick="showWorkout('${current}')">
Novo treino
</button>
</div>
`;
}

function showHistory(){

setActive("btnH");

let history = JSON.parse(localStorage.getItem(key) || "[]");

history.reverse();

let html = `<div class="card"><h2>Histórico</h2>`;

if(history.length === 0){

html += `<p class="muted">Nenhum treino salvo ainda.</p>`;

}else{

history.forEach(function(item,index){

html += `
<div class="history-item">

<strong>${item.workout === "A" ? "Treino A" : "Treino B"}</strong>

<p class="muted">
Data: ${item.date || "-"}<br>
Peso: ${item.weight || "-"} kg<br>
Duração: ${item.duration || "-"} min<br>
Calorias: ${item.calories || "-"}
</p>

<button class="secondary" onclick="showDetails(${history.length - 1 - index})">
Ver detalhes
</button>

</div>
`;

});

}

html += `</div>`;

html += `
<div class="card">

<button class="secondary" onclick="exportJSON()">
📦 Exportar backup JSON
</button>

<br><br>

<button class="secondary" onclick="exportCSV()">
📊 Exportar CSV
</button>

</div>
`;

document.getElementById("app").innerHTML = html;
}

function showDetails(index){

let history = JSON.parse(localStorage.getItem(key) || "[]");

let item = history[index];

let html = `
<div class="card">

<h2>${item.workout === "A" ? "Treino A" : "Treino B"}</h2>

<p>
<strong>Data:</strong> ${item.date || "-"}<br>
<strong>Peso:</strong> ${item.weight || "-"} kg<br>
<strong>Duração:</strong> ${item.duration || "-"} min<br>
<strong>Calorias:</strong> ${item.calories || "-"}
</p>

</div>
`;

item.exercises.forEach(function(ex){

html += `
<div class="card">

<h3>${ex.name}</h3>

<p>
Série 1: ${ex.sets[0].load || "-"} kg × ${ex.sets[0].reps || "-"}<br>
Série 2: ${ex.sets[1].load || "-"} kg × ${ex.sets[1].reps || "-"}<br>
Série 3: ${ex.sets[2].load || "-"} kg × ${ex.sets[2].reps || "-"}
</p>

${ex.observation ? `<p class="muted">Obs.: ${ex.observation}</p>` : ""}

</div>
`;

});

html += `
<button class="primary" onclick="showHistory()">
← Voltar ao histórico
</button>
`;

document.getElementById("app").innerHTML = html;
}

function exportJSON(){

let data = localStorage.getItem(key) || "[]";

downloadFile(
data,
"treino-rafael-backup.json",
"application/json"
);

}

function exportCSV(){

let history = JSON.parse(localStorage.getItem(key) || "[]");

let csv =
"Treino,Data,Peso,Duração,Calorias,Exercício,S1 Carga,S1 Reps,S2 Carga,S2 Reps,S3 Carga,S3 Reps,Observação\n";

history.forEach(function(item){

item.exercises.forEach(function(ex){

csv += [

item.workout,
item.date,
item.weight,
item.duration,
item.calories,
ex.name,
ex.sets[0].load,
ex.sets[0].reps,
ex.sets[1].load,
ex.sets[1].reps,
ex.sets[2].load,
ex.sets[2].reps,
ex.observation

].map(function(value){

return '"' +
String(value || "").replace(/"/g,'""') +
'"';

}).join(",") + "\n";

});

});

downloadFile(
csv,
"treino-rafael.csv",
"text/csv"
);

}

function downloadFile(content,filename,type){

let blob = new Blob(
[content],
{type:type}
);

let url = URL.createObjectURL(blob);

let a = document.createElement("a");

a.href = url;
a.download = filename;

a.click();

URL.revokeObjectURL(url);

}

showWorkout("A");

</script>

</body>
</html>
