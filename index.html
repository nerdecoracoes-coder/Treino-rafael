<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#111827">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<title>Treino Rafael</title>

<style>
*{box-sizing:border-box}

body{
 margin:0;
 font-family:Arial,sans-serif;
 background:#f3f4f6;
 color:#111827;
}

header{
 background:#111827;
 color:#fff;
 padding:15px 12px;
 text-align:center;
 position:sticky;
 top:0;
 z-index:5;
}

header h1{
 margin:0 0 10px;
 font-size:21px;
}

.profile{
 max-width:700px;
 margin:auto;
}
.profile-selector{
 display:flex;
 align-items:center;
 gap:10px;
}

.profile-avatar{
 width:44px;
 height:44px;
 min-width:44px;
 border-radius:50%;
 background:#2563eb;
 color:#fff;
 display:flex;
 align-items:center;
 justify-content:center;
 font-size:22px;
 font-weight:bold;
 overflow:hidden;
 border:2px solid #fff;
}

.profile-avatar img{
 width:100%;
 height:100%;
 object-fit:cover;
}
select,input{

 padding:10px;
 border:1px solid #d1d5db;
 border-radius:8px;
 font-size:14px;
 background:#fff;
}

.exerciseSelect{
 font-size:14px;
 font-weight:bold;
 padding:10px 8px;
}

nav{
 display:flex;
 background:#fff;
 border-bottom:1px solid #ddd;
 position:sticky;
 top:91px;
 z-index:4;
}

nav button{
 flex:1;
 padding:12px 4px;
 border:0;
 background:#fff;
 font-weight:bold;
 color:#555;
}

nav button.active{
 color:#2563eb;
 border-bottom:3px solid #2563eb;
}

main{
 max-width:700px;
 margin:auto;
 padding:12px;
}

.card{
 background:#fff;
 border-radius:12px;
 padding:15px;
 margin-bottom:12px;
 box-shadow:0 1px 4px #0001;
}

.exercise h3{
 margin:0 0 5px;
 font-size:17px;
}

.muted{
 color:#6b7280;
 font-size:13px;
}

.last{
 color:#2563eb;
 font-size:13px;
 margin-bottom:10px;
}

.target{
 background:#eff6ff;
 border:1px solid #bfdbfe;
 border-radius:9px;
 padding:10px;
 margin:8px 0 12px;
}

.target strong{
 color:#1d4ed8;
}

.grid{
 display:grid;
 grid-template-columns:1fr 1fr;
 gap:8px;
}

label{
 display:block;
 font-size:12px;
 color:#666;
 margin-bottom:4px;
}

button{
 cursor:pointer;
}

.primary{
 width:100%;
 padding:14px;
 border:0;
 border-radius:10px;
 background:#2563eb;
 color:#fff;
 font-size:17px;
 font-weight:bold;
}

.secondary{
 padding:10px;
 border:0;
 border-radius:8px;
 background:#e5e7eb;
 font-weight:bold;
}

.danger{
 padding:10px;
 border:0;
 border-radius:8px;
 background:#fee2e2;
 color:#991b1b;
 font-weight:bold;
}

.success{
 text-align:center;
}

.history-item{
 border-top:1px solid #eee;
 padding:12px 0;
}

.row{
 display:flex;
 gap:8px;
 align-items:center;
}

.row>*{
 flex:1;
}

.editor{
 border:1px solid #e5e7eb;
 border-radius:10px;
 padding:12px;
 margin:8px 0;
}

.move{
 display:flex;
 gap:5px;
 margin-top:8px;
}

.move button{
 flex:1;
}

hr{
 border:0;
 border-top:1px solid #eee;
 margin:15px 0;
}

.small{
 font-size:12px;
 color:#6b7280;
}
</style>
</head>

<body>

<header>

<h1>🏋️ Treino Rafael</h1>

<div class="profile">

<label style="color:#d1d5db;text-align:left">
Perfil
</label>

<div class="profile-selector">

<div id="profileAvatar" class="profile-avatar">
👤
</div>

<select id="profileSelect"></select>

</div>

</div>

</header>

<nav>

<button id="btnT">Treino</button>
<button id="btnH">Histórico</button>
<button id="btnC">Configurar</button>

</nav>

<main id="app"></main>

<script>

"use strict";

/* =====================================================
   BANCO
===================================================== */

const DBKEY = "treinoRafaelDB_v7";
const OLDKEY = "treinoRafaelHistorico";


/* =====================================================
   FUNÇÕES BÁSICAS
===================================================== */

function uid(){

 return Date.now().toString(36) +
        Math.random().toString(36).slice(2,8);

}


function clone(obj){

 return JSON.parse(
  JSON.stringify(obj)
 );

}


function esc(value){

 return String(value ?? "")
  .replace(/&/g,"&amp;")
  .replace(/</g,"&lt;")
  .replace(/>/g,"&gt;")
  .replace(/"/g,"&quot;")
  .replace(/'/g,"&#039;");

}


function slug(value){

 return String(value || "perfil")
  .normalize("NFD")
  .replace(/[\u0300-\u036f]/g,"")
  .replace(/[^a-zA-Z0-9]+/g,"-")
  .replace(/^-|-$/g,"")
  .toLowerCase();

}


/* =====================================================
   TREINO A
===================================================== */

const defaultA = {

 id:"A",

 name:"Treino A — Costas, Bíceps e Pernas",

 ex:[

  {
   name:"Agachamento",
   refLoad:18,
   refReps:20,
   targetLoad:18,
   targetReps:20
  },

  {
   name:"Puxada aberta na polia",
   refLoad:52,
   refReps:15,
   targetLoad:52,
   targetReps:15
  },

  {
   name:"Remada neutra máquina",
   refLoad:59,
   refReps:15,
   targetLoad:59,
   targetReps:15
  },

  {
   name:"Leg press máquina",
   refLoad:117,
   refReps:20,
   targetLoad:117,
   targetReps:20
  },

  {
   name:"Bíceps máquina",
   refLoad:36,
   refReps:15,
   targetLoad:36,
   targetReps:15
  },

  {
   name:"Cadeira extensora",
   refLoad:59,
   refReps:15,
   targetLoad:59,
   targetReps:15
  },

  {
   name:"Rosca martelo com halteres",
   refLoad:10,
   refReps:12,
   targetLoad:10,
   targetReps:12
  },

  {
   name:"Supino inclinado com halteres",
   refLoad:"",
   refReps:"",
   targetLoad:"",
   targetReps:""
  },

  {
   name:"Encolhimento com halteres",
   refLoad:"",
   refReps:"",
   targetLoad:"",
   targetReps:""
  }

 ]

};


/* =====================================================
   TREINO B
===================================================== */

const defaultB = {

 id:"B",

 name:"Treino B — Peito, Tríceps, Ombros e Posterior",

 ex:[

  {
   name:"Crucifixo máquina",
   refLoad:100,
   refReps:15,
   targetLoad:100,
   targetReps:15
  },

  {
   name:"Supino reto máquina",
   refLoad:50,
   refReps:15,
   targetLoad:50,
   targetReps:15
  },

  {
   name:"Lombar na máquina",
   refLoad:59,
   refReps:20,
   targetLoad:59,
   targetReps:20
  },

  {
   name:"Cadeira flexora",
   refLoad:36,
   refReps:20,
   targetLoad:36,
   targetReps:20
  },

  {
   name:"Desenvolvimento máquina",
   refLoad:27,
   refReps:15,
   targetLoad:27,
   targetReps:15
  },

  {
   name:"Cadeira abdutora",
   refLoad:45,
   refReps:"",
   targetLoad:45,
   targetReps:""
  },

  {
   name:"Tríceps polia corda",
   refLoad:20,
   refReps:15,
   targetLoad:20,
   targetReps:15
  },

  {
   name:"Tríceps francês corda",
   refLoad:17,
   refReps:12,
   targetLoad:17,
   targetReps:12
  },

  {
   name:"Elevação lateral",
   refLoad:5,
   refReps:12,
   targetLoad:5,
   targetReps:12
  }

 ]

};


/* =====================================================
   CRIAR BANCO
===================================================== */

function createInitialDB(){

 return {

  profiles:[

   {
    id:"rafael",
    name:"Rafael",
    routines:{
     A:clone(defaultA),
     B:clone(defaultB)
    }
   },

   {
    id:"natielle",
    name:"Natielle",
    routines:{}
   }

  ],

  history:[],

  currentProfile:"rafael"

 };

}


/* =====================================================
   LEITURA DO BANCO
===================================================== */

function readDB(){

 let data = null;

 try{

  data = JSON.parse(
   localStorage.getItem(DBKEY)
  );

 }catch(error){

  data = null;

 }


 if(!data || typeof data !== "object"){

  data = createInitialDB();

 }


 if(!Array.isArray(data.profiles)){

  data.profiles = [];

 }


 if(!Array.isArray(data.history)){

  data.history = [];

 }


 /* -----------------------------------------------
    MIGRAÇÃO DO HISTÓRICO ANTIGO
 ------------------------------------------------ */

 try{

  const old = JSON.parse(
   localStorage.getItem(OLDKEY)
  );

  if(Array.isArray(old)){

   old.forEach(item=>{

    data.history.push({

     id:uid(),

     profileId:"rafael",

     workout:item.workout || "A",

     date:item.date || "",

     weight:item.weight || "",

     duration:item.duration || "",

     calories:item.calories || "",

     exercises:item.exercises || []

    });

   });

  }

 }catch(error){}


 /* -----------------------------------------------
    GARANTIR RAFAEL
 ------------------------------------------------ */

 let rafael = data.profiles.find(
  p=>p && p.id==="rafael"
 );


 if(!rafael){

  rafael={

   id:"rafael",

   name:"Rafael",

   routines:{

    A:clone(defaultA),
    B:clone(defaultB)

   }

  };

  data.profiles.unshift(rafael);

 }else{

  if(
   !rafael.routines ||
   typeof rafael.routines !== "object"
  ){

   rafael.routines={};

  }

  if(!rafael.routines.A){

   rafael.routines.A=clone(defaultA);

  }

  if(!rafael.routines.B){

   rafael.routines.B=clone(defaultB);

  }

 }


 /* -----------------------------------------------
    GARANTIR NATIELLE
 ------------------------------------------------ */

 if(!data.profiles.some(
  p=>p && p.id==="natielle"
 )){

  data.profiles.push({

   id:"natielle",

   name:"Natielle",

   routines:{}

  });

 }


 /* -----------------------------------------------
    PERFIL ATUAL
 ------------------------------------------------ */

 if(
  !data.currentProfile ||
  !data.profiles.some(
   p=>p.id===data.currentProfile
  )
 ){

  data.currentProfile="rafael";

 }


 try{

  localStorage.setItem(
   DBKEY,
   JSON.stringify(data)
  );

 }catch(error){}


 return data;

}


let db = readDB();
if(!db.exerciseCategories){
  db.exerciseCategories = [
    "Peito",
    "Costas",
    "Bíceps",
    "Tríceps",
    "Ombros",
    "Quadríceps",
    "Glúteos",
    "Adutores",
    "Abdutores",
    "Posteriores",
    "Panturrilha",
    "Abdômen",
    "Lombar",
      "Cardio"
  ];

  saveDB();
}
 if(!db.exerciseLibrary){
  db.exerciseLibrary = [];
  saveDB();
 }
 /* =====================================================
   PADRONIZAR CATEGORIAS DOS EXERCÍCIOS
===================================================== */

if(db.exerciseCategories){

  const categoriasUnicas = [];

  db.exerciseCategories.forEach(category => {

    const nome = category.trim();

    if(!nome)return;

    const existe =
      categoriasUnicas.find(
        cat =>
          cat.toLowerCase() ===
          nome.toLowerCase()
      );

    if(!existe){
      categoriasUnicas.push(nome);
    }

  });

  db.exerciseCategories =
    categoriasUnicas;


  if(db.exerciseLibrary){

    db.exerciseLibrary.forEach(ex => {

      if(!ex.category)return;

      const categoria =
        db.exerciseCategories.find(
          cat =>
            cat.toLowerCase() ===
            ex.category.trim().toLowerCase()
        );

      if(categoria){
        ex.category = categoria;
      }

    });

  }

  saveDB();

}
let currentRoutine = null;


/* =====================================================
   BANCO
===================================================== */

function saveDB(){

 try{

  localStorage.setItem(
   DBKEY,
   JSON.stringify(db)
  );

 }catch(error){

  alert(
   "Não foi possível salvar no armazenamento do navegador."
  );

 }

}


function getProfile(){

 return db.profiles.find(
  p=>p.id===db.currentProfile
 ) || db.profiles[0];

}


function getRoutine(){

 const p = getProfile();

 if(!p || !currentRoutine){

  return null;

 }

 return p.routines[currentRoutine] || null;

}


/* =====================================================
   ABAS
===================================================== */

function setTab(buttonId){

 ["btnT","btnH","btnC"].forEach(
  id=>{

   document
    .getElementById(id)
    .classList
    .remove("active");

  }
 );

 document
  .getElementById(buttonId)
  .classList
  .add("active");

}


/* =====================================================
   PERFIS
===================================================== */

function refreshProfiles(){

 const select =
  document.getElementById(
   "profileSelect"
  );

 if(!select)return;

 select.innerHTML =
  db.profiles.map(
   p=>`

    <option
     value="${esc(p.id)}"
     ${p.id===db.currentProfile?"selected":""}>

     ${esc(p.name)}

    </option>

   `
  ).join("");
const avatar =
 document.getElementById("profileAvatar");

if(avatar){

 const p=getProfile();

 avatar.innerHTML =
  p && p.photo
   ? `<img src="${esc(p.photo)}" alt="">`
   : "👤";

 }
}


function changeProfile(id){

 db.currentProfile=id;

 const p=getProfile();

 currentRoutine =
  Object.keys(
   p.routines || {}
  )[0] || null;

 saveDB();

 showTraining();

}


/* =====================================================
   ESCOLHER TREINO
===================================================== */

function chooseRoutine(id){

 currentRoutine=id;

 saveDB();

 showTraining();

}


function routineButtons(){

 const p=getProfile();

 return Object.keys(
  p.routines || {}
 ).map(
  id=>`

   <button
    class="${id===currentRoutine
      ?"primary"
      :"secondary"}"
    style="width:auto"
    onclick="chooseRoutine('${esc(id)}')">

    ${esc(p.routines[id].name)}

   </button>

  `
 ).join(" ");

}


/* =====================================================
   TELA DE TREINO
===================================================== */

function showTraining(){

 setTab("btnT");

 refreshProfiles();

 const p=getProfile();

 if(!p){

  document.getElementById("app").innerHTML=`

   <div class="card">

    <h2>Perfil não encontrado</h2>

   </div>

  `;

  return;

 }


 if(
  !currentRoutine ||
  !p.routines[currentRoutine]
 ){

  currentRoutine =
   Object.keys(
    p.routines || {}
   )[0] || null;

 }


 if(!currentRoutine){

  document.getElementById("app").innerHTML=`

   <div class="card">

    <h2>Nenhuma ficha criada</h2>

    <p class="muted">
     Crie uma ficha para começar.
    </p>

    <button
     class="primary"
     onclick="showConfig()">

     ⚙️ Configurar ficha

    </button>

   </div>

  `;

  return;

 }


 const r=getRoutine();

 const today =
  new Date()
   .toISOString()
   .slice(0,10);


 let html=`

  <div class="card">

   <div class="row">

    ${routineButtons()}

   </div>

  </div>


  <div class="card">

   <h2>
    ${esc(r.name)}
   </h2>

   <p class="muted">

    A referência azul é a última S1 registrada.
    A meta é o que você pretende usar no próximo treino.

   </p>


   <div class="grid">

    <div>

     <label>
      Peso hoje (kg)
     </label>

     <input
      id="peso"
      type="number"
      step="0.1">

    </div>


    <div>

     <label>
      Duração (min)
     </label>

     <input
      id="duracao"
      type="number">

    </div>


    <div>

     <label>
      Calorias estimadas
     </label>

     <input
      id="calorias"
      type="number">

    </div>


    <div>

     <label>
      Data
     </label>

     <input
      id="data"
      type="date"
      value="${today}">

    </div>

   </div>

  </div>

 `;


 r.ex.forEach(
  (e,i)=>{

   html+=`

    <div class="card exercise">

     <h3>
      ${i+1}. ${esc(e.name)}
     </h3>


     <div class="last">

      Última S1:

      ${
       e.refLoad !== "" &&
       e.refLoad != null

       ? esc(e.refLoad)+" kg × "+
         esc(e.refReps || "-")+" reps"

       :"sem registro"
      }

     </div>


     <div class="target">

      <strong>
       🎯 Meta para o próximo treino
      </strong>


      <div
       class="grid"
       style="margin-top:7px">

       <div>

        <label>
         Carga alvo
        </label>

        <input
         id="tL${i}"
         type="number"
         step="0.5"
         value="${esc(e.targetLoad ?? "")}">

       </div>


       <div>

        <label>
         Reps alvo
        </label>

        <input
         id="tR${i}"
         type="number"
         value="${esc(e.targetReps ?? "")}">

       </div>

      </div>

     </div>


     <div class="grid">

      <div>

       <label>
        Série 1 — carga
       </label>

       <input
        id="c${i}1"
        type="number"
        step="0.5">

      </div>


      <div>

       <label>
        Série 1 — reps
       </label>

       <input
        id="r${i}1"
        type="number">

      </div>


      <div>

       <label>
        Série 2 — carga
       </label>

       <input
        id="c${i}2"
        type="number"
        step="0.5">

      </div>


      <div>

       <label>
        Série 2 — reps
       </label>

       <input
        id="r${i}2"
        type="number">

      </div>


      <div>

       <label>
        Série 3 — carga
       </label>

       <input
        id="c${i}3"
        type="number"
        step="0.5">

      </div>


      <div>

       <label>
        Série 3 — reps
       </label>

       <input
        id="r${i}3"
        type="number">

      </div>

     </div>


     <br>


     <label>
      Observação
     </label>

     <input
      id="o${i}"
      type="text"
      placeholder="Opcional">

    </div>

   `;

  }
 );


 html+=`

  <button
   class="primary"
   onclick="saveWorkout()">

   ✅ Salvar treino

  </button>

 `;


 document.getElementById(
  "app"
 ).innerHTML=html;

}


/* =====================================================
   SALVAR TREINO
===================================================== */

function saveWorkout(){

 const p=getProfile();

 const r=getRoutine();

 if(!p || !r)return;


 const entry={

  id:uid(),

  profileId:p.id,

  workout:currentRoutine,

  date:
   document.getElementById("data").value,

  weight:
   document.getElementById("peso").value,

  duration:
   document.getElementById("duracao").value,

  calories:
   document.getElementById("calorias").value,

  exercises:[]

 };


 r.ex.forEach(
  (e,i)=>{

   const sets=[
    1,2,3
   ].map(
    n=>({

     load:
      document.getElementById(
       "c"+i+n
      ).value,

     reps:
      document.getElementById(
       "r"+i+n
      ).value

    })
   );


   const targetLoad =
    document.getElementById(
     "tL"+i
    ).value;


   const targetReps =
    document.getElementById(
     "tR"+i
    ).value;


   entry.exercises.push({

    name:e.name,

    refBefore:{

     load:e.refLoad ?? "",

     reps:e.refReps ?? ""

    },

    sets:sets,

    observation:
     document.getElementById(
      "o"+i
     ).value,

    nextTarget:{

     load:targetLoad,

     reps:targetReps

    }

   });


   e.targetLoad=targetLoad;

   e.targetReps=targetReps;


   /*
    A primeira série realizada passa a ser
    a referência para o próximo treino.
   */

   if(sets[0].load !== ""){

    e.refLoad=sets[0].load;

    e.refReps=sets[0].reps;

   }

  }
 );


 db.history.push(entry);

 saveDB();


 document.getElementById(
  "app"
 ).innerHTML=`

  <div class="card success">

   <h2>
    Treino salvo! ✅
   </h2>

   <p>
    Treino gravado no perfil
    <strong>
     ${esc(p.name)}
    </strong>.
   </p>

   <p class="muted">
    Os campos do treino foram limpos.
    A referência e as metas foram atualizadas.
   </p>


   <button
    class="primary"
    onclick="exportWorkout('${entry.id}')">

    📤 Exportar treino do dia

   </button>


   <br><br>


   <button
    class="secondary"
    onclick="showTraining()">

    ↩️ Voltar ao treino

   </button>

  </div>

 `;

}


/* =====================================================
   EXPORTAR TREINO DO DIA
===================================================== */

function exportWorkout(id){

 const entry =
  db.history.find(
   x=>x.id===id
  );

 if(!entry)return;


 const p=getProfile();


 const data={

  tipo:"treino-do-dia",

  exportadoEm:
   new Date().toISOString(),

  perfil:p.name,

  treino:clone(entry)

 };


 downloadJSON(

  data,

  "treino-" +
  entry.date +
  "-" +
  slug(p.name) +
  ".json"

 );

}


/* =====================================================
   HISTÓRICO
===================================================== */

function showHistory(){

 setTab("btnH");

 refreshProfiles();

 const p=getProfile();

 const list =
  db.history
   .filter(
    x=>x.profileId===p.id
   )
   .sort(
    (a,b)=>
     String(b.date)
      .localeCompare(
       String(a.date)
      )
   );


 let html=`

  <div class="card">

   <h2>
    Histórico — ${esc(p.name)}
   </h2>

   <p class="muted">
    Aqui aparecem somente os treinos deste perfil.
   </p>

 `;


 if(!list.length){

  html+=`

   <p>
    Nenhum treino registrado ainda.
   </p>

  `;

 }else{

  list.forEach(

function addProfile(){

 const input =

  );


 const name =
  input.value.trim();


 if(!name){

  alert(
   "Digite o nome do perfil."
  );

  return;

 }


 let id =
  slug(name);


 if(
  db.profiles.some(
   p=>p.id===id
  )
 ){

  id += "-" + Date.now();

 }


 db.profiles.push({

  id:id,

  name:name,
photo:"",
  routines:{}

 });


 db.currentProfile=id;

 currentRoutine=null;

 saveDB();

 showConfig();

}

function saveProfilePhoto(){

  const input =
    document.getElementById(
      "profilePhotoInput"
    );

  const file =
    input?.files?.[0];

  if(!file){
    alert("Selecione uma foto primeiro.");
    return;
  }

  const reader =
    new FileReader();

  reader.onload = function(){

    const p =
      getProfile();

    if(!p)return;

    p.photo =
      reader.result;

    saveDB();

    showConfig();

    alert("Foto do perfil salva!");
  };

  reader.readAsDataURL(file);
 }

function addRoutine(){

 const name =
  prompt(
   "Nome da nova ficha:"
  );


 if(
  !name ||
  !name.trim()
 )return;


 const p=getProfile();


 let id=slug(name);


 if(p.routines[id]){

  id += "-" + Date.now();

 }


 p.routines[id]={

  id:id,

  name:name.trim(),

  ex:[]

 };


 currentRoutine=id;

function importRoutine(){

  const current=getProfile();

  if(!current)return;

  const otherProfiles=db.profiles.filter(
    p=>p.id!==current.id
  );

  if(!otherProfiles.length){
    alert("Não há outro perfil para importar uma ficha.");
    return;
  }

  const profileList=otherProfiles
    .map(
      (p,i)=>`${i+1} - ${p.name}`
    )
    .join("\n");

  const profileChoice=prompt(
    "De qual perfil você quer importar a ficha?\n\n"+
    profileList
  );

  if(!profileChoice)return;

  const profileIndex=
    Number(profileChoice)-1;

  const source=
    otherProfiles[profileIndex];

  if(!source){
    alert("Perfil inválido.");
    return;
  }

  const routines=
    Object.values(source.routines || {});

  if(!routines.length){
    alert(
      "Esse perfil ainda não possui fichas."
    );
    return;
  }

  const routineList=routines
    .map(
      (r,i)=>`${i+1} - ${r.name}`
    )
    .join("\n");

  const routineChoice=prompt(
    "Qual ficha você deseja importar?\n\n"+
    routineList
  );

  if(!routineChoice)return;

  const routineIndex=
    Number(routineChoice)-1;

  const sourceRoutine=
    routines[routineIndex];

  if(!sourceRoutine){
    alert("Ficha inválida.");
    return;
  }

  let newName=
    sourceRoutine.name + " (importada)";

  let newId=
    slug(newName);

  if(current.routines[newId]){
    newId += "_" + Date.now();
  }

  const importedExercises=
    (sourceRoutine.ex || []).map(
      ex=>({

        name:ex.name || "",

        category:ex.category || "",

        instructions:
          ex.instructions || "",

        image:
          ex.image || "",

        images:
          Array.isArray(ex.images)
          ? [...ex.images]
          : [],

        targetLoad:"",

        targetReps:"",

        refLoad:"",

        refReps:""

      })
    );

  current.routines[newId]={
    id:newId,
    name:newName,
    ex:importedExercises
  };

  currentRoutine=newId;

  saveDB();

  showConfig();

  alert(
    "Ficha importada com sucesso!\n\n"+
    "Os exercícios foram importados sem cargas ou repetições."
  );
 }

function addLibraryExercise(){

  const name = prompt(
    "Digite o nome do exercício:"
  );

  if(!name)return;

  const cleanName =
    name.trim();

  if(!cleanName){

    alert(
      "Digite o nome do exercício."
    );

    return;
  }


  const instructions = prompt(
    "Digite as instruções de execução do exercício:\n\n" +
    "Exemplo: Mantenha a coluna reta, puxe a barra em direção ao peito e retorne lentamente."
  );

  const cleanInstructions =
    instructions
      ? instructions.trim()
      : "";


  const categories =
    db.exerciseCategories || [];


  const categoryList =
    categories
      .map(
        (category,i)=>
          `${i+1} - ${category}`
      )
      .join("\n");


  const choice = prompt(
    "Escolha a categoria:\n\n" +
    categoryList +
    "\n\nDigite o número da categoria."
  );


  if(!choice)return;


  const index =
    Number(choice) - 1;


  let cleanCategory =
    categories[index];


  if(!cleanCategory){

    const newCategory =
      prompt(
        "Categoria não encontrada.\n\n" +
        "Digite o nome da nova categoria:"
      );


    if(!newCategory)return;


    cleanCategory =
      newCategory.trim();


    if(!cleanCategory)return;


    const existing =
      categories.find(
        category =>
          category.toLowerCase() ===
          cleanCategory.toLowerCase()
      );


    if(existing){

      cleanCategory =
        existing;

    }else{

      db.exerciseCategories.push(
        cleanCategory
      );

    }

  }


  db.exerciseLibrary.push({

    id:
      Date.now().toString(),

    name:
      cleanName,

    category:
      cleanCategory,

    instructions:
      cleanInstructions,

    image:
      "",

    images:
      []

  });


  saveDB();


  alert(
    "Exercício adicionado à biblioteca!"
  );


  showConfig();

}

  !r.ex[index]
 )return;

  document.getElementById(
   "ename_"+id+"_"+index

/* =====================================================
   REMOVER EXERCÍCIO
===================================================== */

function removeExercise(id,index){

 const p=getProfile();

 const r=p.routines[id];

 if(!r)return;


 if(
  !confirm(
   "Excluir este exercício?"
  )
 )return;


 r.ex.splice(
  index,
  1
 );


 saveDB();

 showConfig();

}


/* =====================================================
   REORDENAR EXERCÍCIO
===================================================== */

function moveExercise(id,index,direction){

 const p=getProfile();

 const r=p.routines[id];

 if(!r)return;


 const newIndex =
  index + direction;


 if(
  newIndex < 0 ||
  newIndex >= r.ex.length
 )return;


 const temp =
  r.ex[index];


 r.ex[index] =
  r.ex[newIndex];


 r.ex[newIndex] =
  temp;


 saveDB();

 showConfig();

}


/* =====================================================
   DOWNLOAD JSON
===================================================== */

function downloadJSON(data,filename){

 const blob =
  new Blob(
   [
    JSON.stringify(
     data,
     null,
     2
    )
   ],
   {
    type:"application/json"
   }
  );


 const url =
  URL.createObjectURL(
   blob
  );


 const a =
  document.createElement(
   "a"
  );


 a.href=url;

 a.download=filename;

 document.body.appendChild(a);

 a.click();

 a.remove();

 URL.revokeObjectURL(url);

}
