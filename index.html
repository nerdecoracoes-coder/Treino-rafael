<style>

body{

button{

}

.primary{

 border:0;
 border-radius:10px;
 background:#2563eb;
 color:#fff;

}

.secondary{

 border:0;
 border-radius:8px;

}

.danger{

 background:#fee2e2;

}

}

.history-item{

.row{

<body>

<header>

<h1>🏋️ Treino Rafael</h1>

<div class="profile">

<label style="color:#d1d5db;text-align:left">
Perfil
</label>

<select id="profileSelect"></select>

</div>

</header>

<nav>

<button id="btnT">
Treino
</button>

<button id="btnH">
Histórico
</button>

<button id="btnC">
Configurar
</button>

<main id="app"></main>

<script>

"use strict";

/* =========================
   BANCO
========================= */

const DBKEY="treinoRafaelDB_v5";
const OLDKEY="treinoRafaelHistorico";

function uid(){

 return Date.now().toString(36)+
 Math.random().toString(36).slice(2,8);

}

function esc(s){

 return String(s ?? "")
 .replace(/&/g,"&amp;")
 .replace(/</g,"&lt;")
 .replace(/>/g,"&gt;")
 .replace(/"/g,"&quot;")
 .replace(/'/g,"&#039;");

}

function slug(s){

 return String(s||"perfil")
 .normalize("NFD")
 .replace(/[\u0300-\u036f]/g,"")
 .replace(/[^a-zA-Z0-9]+/g,"-")
 .replace(/^-|-$/g,"")
 .toLowerCase();

}

function clone(x){

 return JSON.parse(JSON.stringify(x));

}


/* =========================
   TREINO A
========================= */

const defaultA={

 id:"A",

 name:"Treino A — Costas, Bíceps e Pernas",

 ex:[

  {
   name:"Agachamento",
   refLoad:18,
   refReps:20,
   targetLoad:18,
   targetReps:20
  },

  {
   name:"Puxada aberta na polia",
   refLoad:52,
   refReps:15,
   targetLoad:52,
   targetReps:15
  },

  {
   name:"Remada neutra máquina",
   refLoad:59,
   refReps:15,
   targetLoad:59,
   targetReps:15
  },

  {
   name:"Leg press máquina",
   refLoad:117,
   refReps:20,
   targetLoad:117,
   targetReps:20
  },

  {
   name:"Bíceps máquina",
   refLoad:36,
   refReps:15,
   targetLoad:36,
   targetReps:15
  },

  {
   name:"Cadeira extensora",
   refLoad:59,
   refReps:15,
   targetLoad:59,
   targetReps:15
  },

  {
   name:"Rosca martelo com halteres",
   refLoad:10,
   refReps:12,
   targetLoad:10,
   targetReps:12
  },

  {
   name:"Supino inclinado com halteres",
   refLoad:"",
   refReps:"",
   targetLoad:"",
   targetReps:""
  },

  {
   name:"Encolhimento com halteres",
   refLoad:"",
   refReps:"",
   targetLoad:"",
   targetReps:""
  }

 ]

};


/* =========================
   TREINO B
========================= */

const defaultB={

 id:"B",

 name:"Treino B — Peito, Tríceps, Ombros e Posterior",

 ex:[

  {
   name:"Crucifixo máquina",
   refLoad:100,
   refReps:15,
   targetLoad:100,
   targetReps:15
  },

  {
   name:"Supino reto máquina",
   refLoad:50,
   refReps:15,
   targetLoad:50,
   targetReps:15
  },

  {
   name:"Lombar na máquina",
   refLoad:59,
   refReps:20,
   targetLoad:59,
   targetReps:20
  },

  {
   name:"Cadeira flexora",
   refLoad:36,
   refReps:20,
   targetLoad:36,
   targetReps:20
  },

  {
   name:"Desenvolvimento máquina",
   refLoad:27,
   refReps:15,
   targetLoad:27,
   targetReps:15
  },

  {
   name:"Cadeira abdutora",
   refLoad:45,
   refReps:"",
   targetLoad:45,
   targetReps:""
  },

  {
   name:"Tríceps polia corda",
   refLoad:20,
   refReps:15,
   targetLoad:20,
   targetReps:15
  },

  {
   name:"Tríceps francês corda",
   refLoad:17,
   refReps:12,
   targetLoad:17,
   targetReps:12
  },

  {
   name:"Elevação lateral",
   refLoad:5,
   refReps:12,
   targetLoad:5,
   targetReps:12
  }

 ]

};


/* =========================
   LEITURA SEGURA
========================= */

function readDB(){

 let data=null;

 try{

  data=JSON.parse(
   localStorage.getItem(DBKEY)||"null"
  );

 }catch(e){

  data=null;

 }

 if(!data || typeof data!=="object"){

  data={
   profiles:[],
   history:[]
  };

 }

 if(!Array.isArray(data.profiles)){

  data.profiles=[];

 }

 if(!Array.isArray(data.history)){

  data.history=[];

 }


 /* Rafael */

 let rafael=
  data.profiles.find(
   p=>p && p.id==="rafael"
  );

 if(!rafael){

  rafael={

   id:"rafael",

   name:"Rafael",

   routines:{

    A:clone(defaultA),

    B:clone(defaultB)

   }

  };

  data.profiles.unshift(rafael);

 }else{

  if(!rafael.routines ||
     typeof rafael.routines!=="object"){

   rafael.routines={};

  }

  if(!rafael.routines.A){

   rafael.routines.A=clone(defaultA);

  }

  if(!rafael.routines.B){

   rafael.routines.B=clone(defaultB);

  }

 }


 /* Natielle */

 if(!data.profiles.some(
  p=>p && p.id==="natielle"
 )){

  data.profiles.push({

   id:"natielle",

   name:"Natielle",

   routines:{}

  });

 }


 /* Perfil atual */

 if(
  !data.currentProfile ||
  !data.profiles.some(
   p=>p.id===data.currentProfile
  )
 ){

  data.currentProfile="rafael";

 }


 try{

  localStorage.setItem(
   DBKEY,
   JSON.stringify(data)
  );

 }catch(e){}


 return data;

}


/* IMPORTANTE:
   somente agora o banco é criado.
*/

let db=readDB();

let currentRoutine=null;


/* =========================
   FUNÇÕES DO BANCO
========================= */

function saveDB(){

 try{

  localStorage.setItem(
   DBKEY,
   JSON.stringify(db)
  );

 }catch(e){}

}

function profile(){

 return db.profiles.find(
  p=>p.id===db.currentProfile
 ) || db.profiles[0];

}

function routine(){

 const p=profile();

 if(!p || !currentRoutine){

  return null;

 }

 return p.routines[currentRoutine];

}


/* =========================
   NAVEGAÇÃO
========================= */

function setTab(id){

 ["btnT","btnH","btnC"].forEach(
  x=>{
   document
    .getElementById(x)
    .classList
    .remove("active");
  }
 );

 document
  .getElementById(id)
  .classList
  .add("active");

}

function refreshProfiles(){

 const select=
  document.getElementById(
   "profileSelect"
  );

 if(!select)return;

 select.innerHTML=
  db.profiles
  .map(
   p=>
    `<option value="${esc(p.id)}"
     ${p.id===db.currentProfile?"selected":""}>
     ${esc(p.name)}
    </option>`
  )
  .join("");

}

function changeProfile(id){

 db.currentProfile=id;

 const p=profile();

 currentRoutine=
  Object.keys(
   p.routines
  )[0] || null;

 saveDB();

 showTraining();

}


/* =========================
   TREINOS
========================= */

function chooseRoutine(id){

 currentRoutine=id;

 saveDB();

 showTraining();

}

function routineButtons(){

 const p=profile();

 return Object.keys(
  p.routines
 )
 .map(
  id=>
   `<button
    class="${id===currentRoutine
      ?"primary"
      :"secondary"}"
    style="width:auto"
    onclick="chooseRoutine('${esc(id)}')">
    ${esc(p.routines[id].name)}
   </button>`
 )
 .join(" ");

}

function showTraining(){

 setTab("btnT");

 refreshProfiles();

 const p=profile();

 if(!p){

  document.getElementById(
   "app"
  ).innerHTML=
   `<div class="card">
    <h2>Perfil não encontrado</h2>
   </div>`;

  return;

 }


 if(
  !currentRoutine ||
  !p.routines[currentRoutine]
 ){

  currentRoutine=
   Object.keys(
    p.routines
   )[0] || null;

 }


 if(!currentRoutine){

  document.getElementById(
   "app"
  ).innerHTML=
   `<div class="card">
    <h2>Nenhuma ficha criada</h2>
    <button
     class="primary"
     onclick="showConfig()">
     Criar ficha
    </button>
   </div>`;

  return;

 }


 const r=routine();

 const today=
  new Date()
  .toISOString()
  .slice(0,10);


 let html=`

 <div class="card">

  <div class="row">

   ${routineButtons()}

  </div>

 </div>

 <div class="card">

  <h2>
   ${esc(r.name)}
  </h2>

  <p class="muted">
   Os campos do treino real começam vazios.
   A referência azul é a última S1 registrada.
   A meta é o que você pretende usar no próximo treino.
  </p>

  <div class="grid">

   <div>
    <label>Peso hoje (kg)</label>
    <input
     id="peso"
     type="number"
     step="0.1">
   </div>

   <div>
    <label>Duração (min)</label>
    <input
     id="duracao"
     type="number">
   </div>

   <div>
    <label>Calorias estimadas</label>
    <input
     id="calorias"
     type="number">
   </div>

   <div>
    <label>Data</label>
    <input
     id="data"
     type="date"
     value="${today}">
   </div>

  </div>

 </div>

 `;


 r.ex.forEach(
  (e,i)=>{

   html+=`

   <div class="card exercise">

    <h3>
     ${i+1}. ${esc(e.name)}
    </h3>

    <div class="last">

     Última S1:

     ${
      e.refLoad!=="" &&
      e.refLoad!=null

      ?esc(e.refLoad)+" kg × "+
       esc(e.refReps||"-")+" reps"

      :"sem registro"
     }

    </div>

    <div class="target">

     <strong>
      🎯 Meta para o próximo treino
     </strong>

     <div
      class="grid"
      style="margin-top:7px">

      <div>

       <label>
        Carga alvo
       </label>

       <input
        id="tL${i}"
        type="number"
        step="0.5"
        value="${esc(e.targetLoad??"")}">

      </div>

      <div>

       <label>
        Reps alvo
       </label>

       <input
        id="tR${i}"
        type="number"
        value="${esc(e.targetReps??"")}">

      </div>

     </div>

    </div>

    <div class="grid">

     <div>
      <label>Série 1 — carga</label>
      <input
       id="c${i}1"
       type="number"
       step="0.5">
     </div>

     <div>
      <label>Série 1 — reps</label>
      <input
       id="r${i}1"
       type="number">
     </div>

     <div>
      <label>Série 2 — carga</label>
      <input
       id="c${i}2"
       type="number"
       step="0.5">
     </div>

     <div>
      <label>Série 2 — reps</label>
      <input
       id="r${i}2"
       type="number">
     </div>

     <div>
      <label>Série 3 — carga</label>
      <input
       id="c${i}3"
       type="number"
       step="0.5">
     </div>

     <div>
      <label>Série 3 — reps</label>
      <input
       id="r${i}3"
       type="number">
     </div>

    </div>

    <br>

    <label>
     Observação
    </label>

    <input
     id="o${i}"
     type="text"
     placeholder="Opcional">

   </div>

   `;

  }
 );


 html+=`

 <button
  class="primary"
  onclick="saveWorkout()">

  ✅ Salvar treino

 </button>

 `;


 document.getElementById(
  "app"
 ).innerHTML=html;

}


/* =========================
   SALVAR TREINO
========================= */

function saveWorkout(){

 const p=profile();

 const r=routine();

 const entry={

  id:uid(),

  profileId:p.id,

  workout:currentRoutine,

  date:
   document.getElementById(
    "data"
   ).value,

  weight:
   document.getElementById(
    "peso"
   ).value,

  duration:
   document.getElementById(
    "duracao"
   ).value,

  calories:
   document.getElementById(
    "calorias"
   ).value,

  exercises:[]

 };


 r.ex.forEach(
  (e,i)=>{

   const sets=[
    1,2,3
   ].map(
    n=>({

     load:
      document.getElementById(
       "c"+i+n
      ).value,

     reps:
      document.getElementById(
       "r"+i+n
      ).value

    })
   );


   const targetLoad=
    document.getElementById(
     "tL"+i
    ).value;

   const targetReps=
    document.getElementById(
     "tR"+i
    ).value;


   entry.exercises.push({

    name:e.name,

    refBefore:{

     load:e.refLoad ?? "",

     reps:e.refReps ?? ""

    },

    sets:sets,

    observation:
     document.getElementById(
      "o"+i
     ).value,

    nextTarget:{

     load:targetLoad,

     reps:targetReps

    }

   });


   e.targetLoad=
    targetLoad;

   e.targetReps=
    targetReps;


   if(
    sets[0].load!==""
   ){

    e.refLoad=
     sets[0].load;

    e.refReps=
     sets[0].reps;

   }

  }
 );


 db.history.push(entry);

 saveDB();


 document.getElementById(
  "app"
 ).innerHTML=`

 <div class="card success">

  <h2>
   Treino salvo! ✅
  </h2>

  <p>
   Treino gravado no perfil
   <strong>
    ${esc(p.name)}
   </strong>.
  </p>

  <button
   class="primary"
   onclick="exportWorkout('${entry.id}')">

   📤 Exportar treino do dia

  </button>

  <br><br>
