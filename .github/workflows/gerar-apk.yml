name: Gerar APK Android
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Chave de assinatura estável (para o APK poder ser atualizado por cima)
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: evolute-debug-keystore-v1
      - name: Instalar dependências e criar o projeto Android
        working-directory: android-app
        run: |
          npm install 2>&1 | tail -5
          npx cap add android
          python3 patch_manifest.py android/app/src/main/AndroidManifest.xml
          mkdir -p android/app/src/main/assets/public && cp privacypolicy.html android/app/src/main/assets/public/privacypolicy.html
          sed -i 's/minSdkVersion = [0-9]*/minSdkVersion = 26/' android/variables.gradle
          grep minSdkVersion android/variables.gradle
          npx cap sync android
      - name: Compilar
        working-directory: android-app/android
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          chmod +x gradlew && ./gradlew assembleDebug --no-daemon -q
      - name: Publicar
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android-app/android/app/build/outputs/apk/debug/app-debug.apk evolute-training.apk
          gh release create "apk-${{ github.run_number }}" evolute-training.apk --title "Evolute Training (Android) #${{ github.run_number }}" --notes "APK de teste. Instale no celular Android e abra." --latest
